<style>
  /* Novos estilos para o layout Landscape inspirado na referência */
  .landscape-header { background: #0f172a; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius); margin-bottom: 12px; }
  .landscape-nav-links { display: flex; gap: 16px; font-size: 13px; font-weight: 500; }
  .landscape-nav-links span { cursor: pointer; opacity: 0.8; }
  .landscape-nav-links span:hover { opacity: 1; }

  .hero-landscape { position: relative; width: 100%; height: 260px; border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; color: #fff; }
  .hero-landscape::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); z-index: 1; }
  .hero-landscape * { position: relative; z-index: 2; }

  .middle-landscape-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
  .middle-left-img { width: 100%; height: 100%; min-height: 140px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }
  .middle-right-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; justify-content: center; }

  .bottom-4grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .bottom-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; cursor: pointer; transition: 0.2s; }
  .bottom-card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .bottom-card img { width: 100%; height: 60px; object-fit: cover; border-radius: 6px; }
  .bottom-card span { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.2; }

  @media(max-width: 600px) {
    .bottom-4grid { grid-template-columns: repeat(2, 1fr); }
    .middle-landscape-grid { grid-template-columns: 1fr; }
  }
</style>

<script>
// Substituição da função scrHome para seguir o layout landscape com 4 figuras embaixo
function scrHome() {
  const totalPacientes = S.patients.length;
  const consultasHoje = S.appts.filter(a => a.date === today()).length;
  const saldo = sum(S.tx.filter(x => x.type === 'entrada' && x.status === 'pago')) - sum(S.tx.filter(x => x.type === 'despesa' && x.status === 'pago'));

  return `
    <div class="landscape-header">
      <b>Gestor Odonto</b>
      <div class="landscape-nav-links">
        <span onclick="nav('home')">Início</span>
        <span onclick="nav('patients')">Pacientes</span>
        <span onclick="nav('agenda')">Agenda</span>
        <span onclick="nav('fin')">Financeiro</span>
      </div>
    </div>

    <!-- Imagem Principal (Hero Section) com capa.png -->
    <div class="hero-landscape" style="background-image: url('capa.png');">
      <span style="font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9;">Gestão Odontológica Inteligente</span>
      <h2 style="font-size: 22px; font-weight: 700; margin-top: 4px;">Seu consultório organizado e moderno</h2>
    </div>

    <!-- Seção Intermediária: imagem agendamento.png no canto esquerdo + bloco ao lado -->
    <div class="middle-landscape-grid">
      <img src="agendamento.png" class="middle-left-img" alt="Agendamento" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100%\\' height=\\'100%\\' fill=\\'%23e0f2fe\\'/></svg>'">
      <div class="middle-right-card">
        <span style="font-size: 12px; color: var(--muted); font-weight: 600;">Resumo do Dia</span>
        <h3 style="font-size: 16px; margin: 4px 0 8px 0;">${consultasHoje} consulta(s) hoje</h3>
        <p class="muted" style="font-size: 12px; margin-bottom: 8px;">Pacientes cadastrados: <b>${totalPacientes}</b></p>
        <button class="btn sm" onclick="nav('agenda')">Ver Agenda</button>
      </div>
    </div>

    <!-- Bloco Inferior: exatamente as 4 figuras em linha (Atalhos) -->
    <h3 style="margin-bottom: 10px; font-size: 14px; font-weight: 700;">Atalhos Rápidos</h3>
    <div class="bottom-4grid">
      <div class="bottom-card" onclick="patientForm()">
        <img src="sorriso1.png" alt="Novo Paciente" onerror="this.style.display='none'">
        <span>Novo paciente</span>
      </div>
      <div class="bottom-card" onclick="newBudget()">
        <img src="tratamento.png" alt="Novo Orçamento" onerror="this.style.display='none'">
        <span>Novo orçamento</span>
      </div>
      <div class="bottom-card" onclick="txForm('entrada')">
        <img src="financeiro.png" alt="Nova Entrada" onerror="this.style.display='none'">
        <span>Nova entrada</span>
      </div>
      <div class="bottom-card" onclick="nav('reports')">
        <img src="estetica.png" alt="Relatórios" onerror="this.style.display='none'">
        <span>Relatórios</span>
      </div>
    </div>
  `;
}
</script>
