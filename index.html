<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c150e">
<title>Odonto Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1b3524;--forest-2:#24462f;--moss:#4b7a3d;--moss-d:#3b6230;--leaf:#9cc86e;--sage:#e8eedd;--paper:#f5f4ee;
  --ink:#16241a;--muted:#647266;--line:#e0e3d6;--amber:#e8b04a;
  --rose:#c9364e;--rose-t:#fbe4e8;--ok:#2f7a37;--ok-t:#dcefd3;--warn:#9a5b00;--warn-t:#fbeccb;--blue:#2f5f9a;--blue-t:#e0eaf6;
  --tooth:#fbfcf8;--tooth-line:#8d9c8f;
  --bg:var(--paper);--card:#ffffff;--brand:var(--moss);--brand-d:var(--moss-d);--tint:var(--sage);--on-brand:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#232823;color:var(--ink);font-size:15px;line-height:1.5;padding:20px}
h1,h2,h3{font-family:inherit;margin:0;font-weight:600;letter-spacing:-.03em}
h2{font-size:21px}h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
a{color:var(--moss-d)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.frame{max-width:1240px;margin:0 auto;background:var(--paper);border-radius:30px;overflow:hidden;overflow:clip;min-height:calc(100vh - 40px)}
.muted{color:var(--muted)}
.mt{margin-top:14px}.mb{margin-bottom:12px}
.sp{flex:1;min-width:0}.c{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.row input{width:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.list .empty{grid-column:1/-1}
.narrow{max-width:760px}
.pre{white-space:pre-wrap;margin:6px 0 0}
.hint{color:var(--muted);font-size:13px;margin:10px 2px}
.banner{background:var(--warn-t);color:var(--warn);border-radius:14px;padding:9px 14px;font-size:12.5px;font-weight:600;margin-bottom:18px}

/* ===== faixa escura (navegação + hero) ===== */
.band{position:relative;color:#fff;background:#0c150e;isolation:isolate}
.band.mini{background:radial-gradient(760px 240px at 16% -70%,rgba(232,176,74,.36),transparent 70%),linear-gradient(180deg,#14261a,#0b140d)}
.band.hero{min-height:620px;display:flex;flex-direction:column}
.band .art{position:absolute;inset:0;width:100%;height:100%;z-index:-2;object-fit:cover;object-position:72% 30%}
.band.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,24,15,.94) 0%,rgba(8,24,15,.84) 38%,rgba(8,24,15,.46) 56%,rgba(8,24,15,.1) 72%,rgba(8,24,15,0) 86%),linear-gradient(180deg,rgba(8,24,15,.6) 0%,rgba(8,24,15,0) 28%),linear-gradient(0deg,rgba(8,24,15,.55),transparent 30%)}
.topbar{display:flex;align-items:center;gap:16px;padding:22px 32px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff}
.brand svg{color:var(--leaf)}
.brand b{display:block;font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
.brand small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:4px;margin:0 auto;padding:5px;border-radius:999px;background:rgba(10,28,18,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
.pills>button,.pills .dd>button{background:none;border:0;color:rgba(255,255,255,.92);font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pills button.on{background:#fff;color:var(--forest)}
.dd{position:relative}
.pills .pop{display:none;position:absolute;top:calc(100% + 12px);left:0;min-width:230px;background:#fff;border-radius:20px;padding:8px;box-shadow:0 20px 44px rgba(0,0,0,.3);z-index:40}
.pills .dd.open .pop{display:block}
.pills .pop button{display:block;width:100%;text-align:left;background:none;color:var(--ink);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;border:0;cursor:pointer}
.pills .pop button:hover{background:var(--sage)}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--moss);color:#fff;border:0;border-radius:999px;padding:6px 6px 6px 20px;font-weight:700;font-size:14px;cursor:pointer}
.cta .ar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--forest);display:grid;place-items:center}
.hero-in{padding:70px 32px 72px;max-width:620px}
.eyebrow{color:var(--leaf);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;line-height:1.75;margin:0 0 26px}
.hero-in h1{font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:-.045em;margin:0 0 22px}
.hero-in .sub{max-width:390px;color:rgba(255,255,255,.92);margin:0 0 28px;font-size:15.5px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn-hero{display:inline-flex;align-items:center;gap:10px;background:var(--moss);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;cursor:pointer}
.btn-hero.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.badge{position:absolute;top:112px;right:32px;display:flex;align-items:center;gap:12px;background:rgba(10,28,18,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:10px 18px 10px 12px}
.badge .avs{display:flex}
.badge .avs i{width:34px;height:34px;border-radius:50%;background:var(--sage);color:var(--forest);border:2px solid #14261a;margin-left:-9px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.badge .avs i:first-child{margin-left:0}
.badge b{font-size:20px;font-weight:700;display:block;line-height:1.1}
.badge small{font-size:11px;opacity:.8}

/* ===== página ===== */
.page{padding:36px 40px 56px}
.head{display:flex;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.head h1{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.04em}
.head h1.sm{font-size:21px;line-height:1.2;letter-spacing:-.02em}
.icon{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.card.sage{background:var(--sage);border-color:transparent}
.stat span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.03em;display:block;margin-top:2px}
.stat small{color:var(--muted);font-size:12.5px}
.pos{color:var(--ok)}.neg{color:var(--rose)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:28px 14px;border:1.5px dashed #ccd2c0;border-radius:20px}
.lab{font-size:12px;font-weight:700;color:var(--moss-d);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.h2{font-size:clamp(26px,3.2vw,38px);line-height:1.12;letter-spacing:-.04em;font-weight:600;margin:0 0 12px}
.lead{color:#3e4d42;font-size:16px;margin:0 0 22px;max-width:520px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;gap:10px}
.sechint{max-width:340px;color:var(--muted);font-size:13.5px;margin:0}
.huge{font-size:clamp(36px,4.6vw,54px);font-weight:600;letter-spacing:-.045em;line-height:1.05;margin:18px 0 6px}
.ib{width:38px;height:38px;border-radius:50%;background:#d6e4c6;color:var(--moss-d);display:grid;place-items:center;flex:none}

/* botões e formulários */
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--forest);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.moss{background:var(--moss)}
.btn.ghost{background:var(--sage);color:var(--forest)}
.btn.line{background:transparent;border:1px solid #cdd3c1;color:var(--ink)}
.btn.danger{background:var(--rose-t);color:var(--rose)}
.btn.sm{padding:8px 15px;font-size:13px}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:20px}.actions .btn{flex:1}
.rb{width:42px;height:42px;border-radius:50%;border:0;background:var(--sage);color:var(--forest);display:grid;place-items:center;cursor:pointer;flex:none}
.rb.g{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:13px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #d5dac9;border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--moss);box-shadow:0 0 0 3px rgba(75,122,61,.2)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d5dac9;border-radius:999px;padding:0 16px;margin-bottom:16px;color:var(--muted);max-width:520px}
.search input{border:0;box-shadow:none!important;padding:12px 0;background:transparent}
.seg{display:inline-flex;background:#eceee3;border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--forest);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;border:1px solid #d5dac9;background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sage);color:var(--moss-d);white-space:nowrap}
.tag.ok{background:var(--ok-t);color:var(--ok)}.tag.warn{background:var(--warn-t);color:var(--warn)}
.tag.rose{background:var(--rose-t);color:var(--rose)}.tag.blue{background:var(--blue-t);color:var(--blue)}
.tag.gray{background:#eceee3;color:var(--muted)}

/* listas */
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:#c5cdb6}
.av{flex:none;width:42px;height:42px;border-radius:14px;background:var(--sage);color:var(--moss-d);display:grid;place-items:center;font-weight:800;font-size:13px;overflow:hidden}
.av.lg{width:48px;height:48px;font-size:16px;border-radius:50%}
.av.in{background:var(--ok-t);color:var(--ok)}.av.out{background:var(--rose-t);color:var(--rose)}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:700}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);cursor:pointer;font-size:15px}
.menu .mi{width:42px;height:42px;border-radius:50%;background:var(--sage);color:var(--moss-d);display:grid;place-items:center;flex:none}
.menu small{display:block;color:var(--muted);font-size:12.5px}
.menu>svg:last-child{color:var(--muted)}

/* blocos "foto" (estilo da referência) */
.duo{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:stretch}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{position:relative;border-radius:26px;overflow:hidden;background:#0d1a10;color:#fff;isolation:isolate}
.tile .art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.tile img.art{object-fit:cover;transition:transform .6s ease}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,10,6,.72),rgba(4,10,6,.08) 62%)}
.tile.photo::after{background:linear-gradient(180deg,rgba(6,20,13,.62) 0%,rgba(6,20,13,.04) 34%,rgba(6,20,13,.12) 52%,rgba(6,20,13,.82) 100%)}
.tcard .tile.photo::after{background:linear-gradient(0deg,rgba(6,20,13,.32),rgba(6,20,13,0) 45%)}
.c{position:absolute;width:17px;height:17px;border:2px solid rgba(255,255,255,.85);z-index:2;pointer-events:none}
.c.tl{top:14px;left:14px;border-right:0;border-bottom:0;border-top-left-radius:9px}
.c.tr{top:14px;right:14px;border-left:0;border-bottom:0;border-top-right-radius:9px}
.c.bl{bottom:14px;left:14px;border-right:0;border-top:0;border-bottom-left-radius:9px}
.c.br{bottom:14px;right:14px;border-left:0;border-top:0;border-bottom-right-radius:9px}
.tall{min-height:480px}
.tin{position:relative;padding:32px 30px;display:flex;flex-direction:column;height:100%;min-height:inherit;gap:14px}
.tlab{font-size:13px;font-weight:600;opacity:.9}
.tdate{font-size:clamp(32px,4vw,46px);font-weight:600;letter-spacing:-.04em;line-height:1.05}
.tsub{opacity:.9;font-size:14px}
.tlist{margin-top:auto;flex:none}
.tempty{opacity:.9;margin:6px 0;font-size:13.5px}
.trow{display:flex;gap:8px;flex-wrap:wrap}
.glass{background:rgba(10,28,18,.5);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:8px;cursor:pointer}
.gt{font-size:14px;font-weight:800;min-width:46px}.gn{font-weight:700;font-size:14.5px}.gs{font-size:12.5px;opacity:.85}
.btn.glassbtn{background:rgba(10,28,18,.5);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)}
.tin2{padding:26px 24px;display:flex;flex-direction:column;height:100%;min-height:230px;justify-content:space-between;position:relative}
.tbig{font-size:clamp(32px,3.8vw,44px);font-weight:600;letter-spacing:-.04em;line-height:1.05;margin:14px 0 4px}
.tcard{cursor:pointer}
.tcard:hover .tile img.art{transform:scale(1.05)}
.tcard .tile{aspect-ratio:1/1.05}
.tcap{display:flex;align-items:center;gap:10px;padding:12px 4px 0}
.tcap b{display:block;font-size:15px;font-weight:700}.tcap small{display:block;color:var(--muted);font-size:12.5px}
.mini{border:0;border-radius:999px;background:var(--sage);color:var(--forest);font-weight:700;font-size:12px;padding:5px 11px;cursor:pointer;margin:4px 6px 0 0}

/* navegação inferior (celular) */
.bnav{display:none}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--forest);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rose)}

/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(6,18,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}.tile img.art{transition:none}.tcard:hover .tile img.art{transform:none}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:28px}}

/* odontograma */
.tools{position:sticky;top:0;z-index:5;background:var(--paper);padding-top:8px}
.odo{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:700px){.odo{grid-template-columns:1fr 1fr;gap:22px 0}.quad:nth-child(odd){border-right:2px solid var(--line);padding-right:12px}.quad:nth-child(even){padding-left:12px}}
.quad-t{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 4px 2px}
.teeth{display:flex}.teeth.r{justify-content:flex-end}.teeth.l{justify-content:flex-start}
.tooth{flex:0 0 12.5%;min-width:0;text-align:center}
.tooth svg{width:100%;max-width:56px;height:auto;display:block;margin:0 auto;cursor:pointer}
.tooth .n{font-size:12px;font-weight:800;color:var(--muted);background:none;border:0;padding:3px 0 2px;cursor:pointer}
.finds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.find{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}

/* orçamento */
.bi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.bi .g{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:4px}
.bi small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px}
.tot{border-top:1px dashed #ccd2c0;margin-top:14px;padding-top:8px}
.tot .kv{border:0;padding:4px 0}.tot .big{font-size:24px;letter-spacing:-.03em}

/* gráficos */
.bars{display:flex;gap:6px;align-items:flex-end}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bpair{display:flex;align-items:flex-end;gap:3px;height:104px;justify-content:center;width:100%}
.bpair i{display:block;width:40%;max-width:16px;border-radius:5px 5px 0 0;min-height:2px}
.bcol small{font-size:10.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:9px;border-radius:5px;background:var(--sage);overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--moss);border-radius:5px}

/* agenda: calendário */
.st-agendado{--sc:#4a7fbf;--sb:#e1eaf6;--st:#27508a}
.st-confirmado{--sc:#4b7a3d;--sb:#dcefd0;--st:#24561e}
.st-concluido{--sc:#a3aa9f;--sb:#ebede4;--st:#657064}
.st-faltou{--sc:#d9485f;--sb:#fbe3e6;--st:#a1283c}
.st-cancelado{--sc:#a3aa9f;--sb:#ebede4;--st:#8a938a}
.cal-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.ctitle{min-width:170px;text-align:center;font-size:17px;letter-spacing:-.02em}
.cal{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sage);font-weight:700;font-size:12.5px;color:var(--moss-d);text-align:center;padding:11px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cd{min-height:124px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.cd:nth-child(7n+1){border-left:0}
.cd:hover{background:#fafbf6}
.cd.off{background:#fafaf6;color:#a4ada4}
.cd .dn{font-weight:700;font-size:13px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cd.today .dn{background:var(--moss);color:#fff}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--sc,#4a7fbf);background:var(--sb,#e1eaf6);color:var(--st,#27508a);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.st-cancelado,.blk.st-cancelado{text-decoration:line-through}
.more{font-size:11.5px;color:var(--muted);font-weight:700;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sc,#4a7fbf);display:inline-block}
.wkwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:24px}
.wk{min-width:820px;display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.wk .hd{text-align:center;padding:10px 4px 8px;background:var(--sage);font-size:12.5px;font-weight:700;color:var(--moss-d)}
.wk .hd b{display:grid;place-items:center;width:32px;height:32px;margin:2px auto 0;border-radius:50%;font-size:16px;color:var(--ink)}
.wk .hd.today b{background:var(--moss);color:#fff}
.wk .tm{position:relative}
.wk .tm span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.wk .tm span:first-child{transform:none}
.wk .col{position:relative;border-left:1px solid var(--line);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.blk{position:absolute;border-left:3px solid var(--sc,#4a7fbf);background:var(--sb,#e1eaf6);color:var(--st,#27508a);border-radius:8px;padding:3px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:1}
.blk .bs{font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:#e0454f;z-index:3}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#e0454f}

/* login */
.authpage{min-height:100vh;position:relative;display:grid;place-items:center;padding:24px;color:#fff;isolation:isolate;background:#0c150e}
.authbg{position:absolute;inset:0;z-index:-2}.authbg .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 30%}
.authpage::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(6,20,12,.7)}
.authbox{width:100%;max-width:420px}
.authbox h1{font-size:38px;letter-spacing:-.045em;line-height:1.05;margin:26px 0 8px}
.authbox>p{color:rgba(255,255,255,.88);margin:0 0 20px}
.authbox .card{color:var(--ink)}

/* impressão */
#printdoc{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  #app,#toast,#modal-root{display:none!important}
  #printdoc{display:block;padding:24px;font-family:Manrope,Arial,sans-serif;font-size:13px}
  #printdoc table{width:100%;border-collapse:collapse;margin:14px 0}
  #printdoc th,#printdoc td{border-bottom:1px solid #999;padding:6px 4px;text-align:left}
  #printdoc .r{text-align:right}
  #printdoc .sign{margin-top:70px;display:flex;gap:40px}
  #printdoc .sign div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:12px}
}

/* responsivo */
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){
  body{padding:0}
  .frame{border-radius:0;min-height:100vh}
  .pills{display:none}
  .topbar{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
  .cta{margin-left:auto;padding:5px 5px 5px 16px}
  .brand b{font-size:21px}
  .band.hero{min-height:640px}
  .band .art{object-position:74% 20%}
  .band.hero::after{background:linear-gradient(0deg,rgba(8,24,15,.96) 0%,rgba(8,24,15,.88) 42%,rgba(8,24,15,.2) 68%,rgba(8,24,15,.5) 100%)}
  .hero-in{padding:32px 20px 40px;margin-top:auto}
  .badge{display:none}
  .page{padding:22px 16px calc(112px + env(safe-area-inset-bottom,0px))}
  .duo{grid-template-columns:1fr;gap:26px}
  .tall{min-height:420px}
  .bnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 32px rgba(10,25,15,.22);z-index:20;padding:6px;gap:2px}
  .bnav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px 7px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:18px}
  .bnav button.on{background:var(--forest);color:#fff}
  #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .list{grid-template-columns:1fr}
  .cd{min-height:64px;padding:4px}
  .evs{display:none}.dots{display:flex}
  .cal-h{font-size:11px}
}
@media (max-width:560px){.pair{grid-template-columns:1fr}.tiles{gap:12px}.ctitle{min-width:0;flex:1}.eyebrow{display:none}.sec{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="printdoc"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

/* ============================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Project Settings → API). Deixe vazio para usar o modo local.
   ============================================================ */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* ---------- utilidades ---------- */
const T = {patients:'gestor_patients',plans:'gestor_plan_items',budgets:'gestor_budgets',tx:'gestor_transactions',appts:'gestor_appointments',procs:'gestor_procedures'};
const LS='gestor_odonto_v1', LSC='gestor_odonto_clinic';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const fdate=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const money0=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const sum=a=>a.reduce((s,x)=>s+Number(x.value||0),0);
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const M3=MONTHS.map(m=>m.slice(0,3).toLowerCase());
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const mlabel=m=>MONTHS[+m.slice(5,7)-1]+' de '+m.slice(0,4);
const shiftMonth=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1)).slice(0,7);
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return iso(dt);}
const digits=s=>String(s||'').replace(/\D/g,'');
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const short=n=>{const w=String(n||'').trim().split(/\s+/);return w.length>1?w[0]+' '+w[w.length-1][0]+'.':(w[0]||'');};
const pname=id=>{const p=S.patients.find(x=>x.id===id);return p?p.name:'—';};
function waLink(phone,text){let d=digits(phone);if(d&&d.length<=11)d='55'+d;return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');}
const opts=(l,sel)=>l.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`;}).join('');
const patOpts=sel=>opts([['','Selecione…'],...[...S.patients].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>[p.id,p.name])],sel||'');
const procList=()=>`<datalist id="dl_procs">${S.procs.map(o=>`<option value="${esc(o.name)}">`).join('')}</datalist>`;
const val=id=>{const e=document.getElementById('f_'+id);return e?e.value:'';};
const num=id=>parseFloat(String(val(id)).replace(',','.'))||0;
const empty=m=>`<div class="empty">${m}</div>`;
const lst=h=>`<div class="list">${h}</div>`;
const IC={
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6c2 .6 3.5 2.4 3.5 5.4"/>',
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  wallet:'<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><circle cx="17" cy="14.5" r="1.2"/>',
  dots:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',chevd:'<path d="M6 9l6 6 6-6"/>',
  arrow:'<path d="M7 17 17 7M8 7h9v9"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  chart:'<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
  tooth:'<path d="M7 3.5c-2.5 0-4 2-4 4.4 0 2 .8 3.3 1.5 5 .7 1.7.6 4 1.3 6.5.3 1.2 1.8 1.2 2.2 0 .6-2 .9-4 2-4s1.4 2 2 4c.4 1.2 1.9 1.2 2.2 0 .7-2.5.6-4.8 1.3-6.5.7-1.7 1.5-3 1.5-5C21 5.5 19.5 3.5 17 3.5c-1.7 0-2.5 1-5 1s-3.3-1-5-1z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
  out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
  save:'<path d="M12 3v12M8 11l4 4 4-4M5 20h14"/>',
  send:'<path d="M12 15V3M8 7l4-4 4 4M5 14v6h14v-6"/>'
};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>{t.className='';},2800);}
function modal(html){$('#modal-root').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeModal()"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}

/* ---------- arte de jardim (hero e blocos) ---------- */
function gardenArt(seed,path){
  let s0=seed*7919+13;const r=n=>{s0=(s0*9301+49297)%233280;return s0/233280*n;};
  const id='ga'+seed+(path?'p':''),W=1200,H=600,G=['#12281a','#173420','#1e4227','#275232','#33663a','#4b8443'];
  const gx=path?24:(18+r(64)),gy=path?20:(6+r(34));
  let f='',tr='',st='',hl='';
  for(let i=0;i<(path?34:22);i++)f+=`<ellipse cx="${r(W)|0}" cy="${(H*.42+r(H*.6))|0}" rx="${(40+r(120))|0}" ry="${(26+r(80))|0}" fill="${G[r(G.length)|0]}" opacity="${(.55+r(.45)).toFixed(2)}"/>`;
  for(let i=0;i<9;i++)tr+=`<ellipse cx="${(path?520+r(680):r(W))|0}" cy="${r(H*.45)|0}" rx="${(70+r(120))|0}" ry="${(50+r(90))|0}" fill="${G[r(3)|0]}" opacity="${(.7+r(.3)).toFixed(2)}"/>`;
  if(path)for(let i=0;i<11;i++){const t=i/10,w=300*(1-t*.82),h=44*(1-t*.78),cx=820-t*300+Math.sin(t*3)*36,y=585-t*290;st+=`<rect x="${(cx-w/2)|0}" y="${y|0}" width="${w|0}" height="${h|0}" rx="7" fill="#cfcab0" opacity="${(.9-t*.5).toFixed(2)}"/>`;}
  for(let i=0;i<14;i++)hl+=`<circle cx="${r(W)|0}" cy="${(H*.5+r(H*.5))|0}" r="${(5+r(16))|0}" fill="#7db356" opacity="${(.15+r(.3)).toFixed(2)}"/>`;
  return `<svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="${id}s" cx="${gx}%" cy="${gy}%" r="60%"><stop offset="0" stop-color="#f6c15a" stop-opacity=".85"/><stop offset=".4" stop-color="#d08a2e" stop-opacity=".3"/><stop offset="1" stop-color="#0c150e" stop-opacity="0"/></radialGradient><filter id="${id}b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter><filter id="${id}c"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="${W}" height="${H}" fill="#0b160e"/><rect width="${W}" height="${H}" fill="url(#${id}s)"/><g filter="url(#${id}b)">${tr}</g>${st?`<g filter="url(#${id}c)">${st}</g>`:''}<g filter="url(#${id}c)">${f}${hl}</g></svg>`;
}
const BRK='<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>';
const photo=(src,pos,hi)=>`<img class="art photo" src="${src}" alt="" style="object-position:${pos}" ${hi?'fetchpriority="high"':'loading="lazy"'} decoding="async" onerror="this.remove()">`;
let HERO_ART='';

/* ---------- estado e dados ---------- */
let sb=null,LOCAL=true,user=null,CLINIC={};
let S={patients:[],plans:[],budgets:[],tx:[],appts:[],procs:[]};
const V={screen:'home',pid:null,ptab:'dados',q:'',tool:'carie',dec:false,month:today().slice(0,7),ftype:'todas',agendaDate:today(),aview:'month',bfilter:'todos',period:6,bud:null,bfrom:'list',txType:'entrada'};
const DEF_PROCS=[['Consulta / avaliação',150],['Profilaxia (limpeza)',180],['Restauração de resina - 1 face',200],['Restauração de resina - 2 faces',280],['Restauração de resina - 3 faces',350],['Tratamento de canal (endodontia)',900],['Extração simples',250],['Extração de siso',500],['Coroa protética',1500],['Implante unitário',3500],['Clareamento dental',900],['Faceta de resina',600],['Raspagem periodontal (por sextante)',150],['Aplicação de flúor',80],['Selante',90],['Instalação de aparelho ortodôntico',1200],['Manutenção ortodôntica',180],['Alinhadores ortodônticos (plano)',8000],['Radiografia periapical',40],['Radiografia panorâmica',120]];

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS));if(d)S={...S,...d};}catch(e){}}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function loadClinic(){try{CLINIC=JSON.parse(localStorage.getItem(LSC))||{};}catch(e){CLINIC={};}if(!LOCAL&&user&&user.user_metadata&&user.user_metadata.clinic)CLINIC=user.user_metadata.clinic;}
async function loadRemote(){
  const keys=Object.keys(T);
  const res=await Promise.all(keys.map(k=>sb.from(T[k]).select('*').order('created_at',{ascending:true})));
  keys.forEach((k,i)=>{if(res[i].error)toast('Erro ao carregar '+k+': '+res[i].error.message,true);else S[k]=res[i].data;});
}
async function save(kind,obj){
  const row={...obj};Object.keys(row).forEach(k=>{if(row[k]==='')row[k]=null;});
  if(!row.id)row.id=uid();
  const arr=S[kind];const i=arr.findIndex(x=>x.id===row.id);
  if(i<0&&!row.created_at)row.created_at=new Date().toISOString();
  const full=i>=0?{...arr[i],...row}:row;
  if(i>=0)arr[i]=full;else arr.push(full);
  if(LOCAL)persistLocal();
  else{const {error}=await sb.from(T[kind]).upsert(full);if(error)toast('Erro ao salvar: '+error.message,true);}
  return full;
}
async function bulkInsert(kind,rows){
  rows=rows.map((r,i)=>({created_at:new Date(Date.now()+i).toISOString(),...r}));
  if(LOCAL){S[kind].push(...rows);persistLocal();return;}
  const {data,error}=await sb.from(T[kind]).insert(rows).select();
  if(error){toast('Erro ao salvar: '+error.message,true);return;}
  S[kind].push(...data);
}
async function del(kind,id){
  S[kind]=S[kind].filter(x=>x.id!==id);
  if(kind==='patients'){S.plans=S.plans.filter(x=>x.patient_id!==id);S.budgets=S.budgets.filter(x=>x.patient_id!==id);S.appts=S.appts.filter(x=>x.patient_id!==id);S.tx.forEach(x=>{if(x.patient_id===id)x.patient_id=null;});}
  if(kind==='budgets')S.tx.forEach(x=>{if(x.budget_id===id)x.budget_id=null;});
  if(LOCAL)persistLocal();
  else{const {error}=await sb.from(T[kind]).delete().eq('id',id);if(error)toast('Erro ao excluir: '+error.message,true);}
}
async function delItem(kind,id){if(!confirm('Excluir este item?'))return;await del(kind,id);closeModal();render();toast('Excluído.');}
async function seedProcsIfEmpty(){if(S.procs.length)return;await bulkInsert('procs',DEF_PROCS.map(([name,value])=>({id:uid(),name,value})));}

/* ---------- estrutura da página ---------- */
function nav(s,o){Object.assign(V,o||{});V.screen=s;render();window.scrollTo(0,0);}
function toggleDd(e){e.stopPropagation();e.currentTarget.parentElement.classList.toggle('open');}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));
const NAVIT=[['home','Início','home'],['patients','Pacientes','users'],['agenda','Agenda','calendar'],['fin','Financeiro','wallet']];
function band(home,on){
  const top=`<div class="topbar"><div class="brand" onclick="nav('home')">${ic('tooth',30)}<div><b>Odonto</b><small>${esc(CLINIC.name||'Gestão clínica')}</small></div></div>
  <nav class="pills">${NAVIT.map(([k,l])=>`<button class="${on===k?'on':''}" onclick="nav('${k}')">${l}</button>`).join('')}
   <div class="dd"><button class="${on==='more'?'on':''}" onclick="toggleDd(event)">Gestão ${ic('chevd',14)}</button><div class="pop">
    <button onclick="nav('budgets')">Orçamentos</button><button onclick="nav('reports')">Relatórios</button><button onclick="nav('procs')">Tabela de procedimentos</button><button onclick="clinicForm()">Dados da clínica</button><button onclick="nav('more')">Backup e conta</button></div></div></nav>
  <button class="cta" onclick="apptForm()">Agendar <span class="ar">${ic('arrow',16)}</span></button></div>`;
  if(!home)return `<header class="band mini">${top}</header>`;
  HERO_ART=HERO_ART||gardenArt(11,true)+photo('capa.png','72% 30%',true);
  const av=S.patients.slice(0,3).map(p=>`<i>${esc(initials(p.name))}</i>`).join('')||`<i>${ic('tooth',16)}</i>`;
  return `<header class="band hero">${HERO_ART}${top}
  <div class="badge"><div class="avs">${av}</div><div><b>${S.patients.length}</b><small>Pacientes cadastrados</small></div></div>
  <div class="hero-in"><p class="eyebrow">Pacientes. Agenda. Financeiro.<br>Tudo no lugar certo.</p>
   <h1>Sua clínica, organizada naturalmente.</h1>
   <p class="sub">Do primeiro cadastro ao fechamento do caixa, com odontograma, orçamentos e agenda em um só lugar.</p>

function renderAuth(){
  $('#app').innerHTML=`<div class="authpage"><div class="authbg">${gardenArt(11,true)}${photo('capa.png','72% 30%',true)}</div><div class="authbox">
  <div class="brand">${ic('tooth',32)}<div><b>Odonto</b><small>Gestão clínica</small></div></div>

  <div class="card"><label class="f" style="margin-top:0">E-mail</label><input id="a_email" type="email" autocomplete="email">
  <label class="f">Senha</label><input id="a_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth('in')">
  <div class="row mt"><button class="btn sp" onclick="doAuth('in')">Entrar</button><button class="btn ghost sp" onclick="doAuth('up')">Criar conta</button></div>
  <p id="a_msg" class="muted" style="margin:12px 0 0"></p></div></div></div>`;
}
async function doAuth(mode){
  const email=$('#a_email').value.trim(),password=$('#a_pass').value,msg=$('#a_msg');
  if(!email||password.length<6){msg.textContent='Informe o e-mail e uma senha com pelo menos 6 caracteres.';return;}
  msg.textContent='Aguarde…';
  try{
    if(mode==='up'){
      const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;
      if(!data.session){msg.textContent='Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.';return;}
      user=data.user;
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;
    }
    await afterLogin();
  }catch(e){
    const m=e.message||'';
    msg.textContent=/invalid login/i.test(m)?'E-mail ou senha incorretos.':/already registered/i.test(m)?'Este e-mail já tem conta. Toque em Entrar.':(m||'Não foi possível entrar.');
  }
}
async function afterLogin(){loadClinic();await loadRemote();await seedProcsIfEmpty();V.screen='home';render();}
async function doLogout(){if(!confirm('Sair da conta?'))return;await sb.auth.signOut();user=null;S={patients:[],plans:[],budgets:[],tx:[],appts:[],procs:[]};render();}

/* ---------- odontograma ---------- */
const TOOLS=[
 {k:'carie',l:'Cárie',c:'#ef4444',t:'face'},{k:'restauracao',l:'Restauração',c:'#3b82f6',t:'face'},
 {k:'fratura',l:'Fratura',c:'#f59e0b',t:'face'},{k:'selante',l:'Selante',c:'#22c55e',t:'face'},
 {k:'canal',l:'Endodontia',c:'#7c3aed',t:'whole'},{k:'coroa',l:'Coroa',c:'#d97706',t:'whole'},
 {k:'implante',l:'Implante',c:'#475569',t:'whole'},{k:'ext_ind',l:'Extração indicada',c:'#dc2626',t:'whole'},
 {k:'ausente',l:'Ausente',c:'#94a3b8',t:'whole'},{k:'limpar',l:'Borracha',c:'#4b7a3d',t:'clear'}];
const rng=(a,b)=>Array.from({length:Math.abs(b-a)+1},(_,i)=>a<=b?a+i:a-i);
const QUADS=[{k:1,ids:rng(18,11),t:'Superior direito'},{k:2,ids:rng(21,28),t:'Superior esquerdo'},{k:4,ids:rng(48,41),t:'Inferior direito'},{k:3,ids:rng(31,38),t:'Inferior esquerdo'}];
const QDEC=[{k:5,ids:rng(55,51),t:'Superior direito'},{k:6,ids:rng(61,65),t:'Superior esquerdo'},{k:8,ids:rng(85,81),t:'Inferior direito'},{k:7,ids:rng(71,75),t:'Inferior esquerdo'}];
const toolName=k=>(TOOLS.find(t=>t.k===k)||{}).l||k;
const toolColor=k=>(TOOLS.find(t=>t.k===k)||{}).c||'#999';
function tabOdonto(p){
  return `<div class="chips tools">${TOOLS.map(t=>`<button class="chip ${V.tool===t.k?'on':''}" data-k="${t.k}" onclick="setTool('${t.k}')"><i style="background:${t.c}"></i>${t.l}</button>`).join('')}</div>
  <div class="seg mb"><button class="${!V.dec?'on':''}" onclick="V.dec=false;render()">Dentes permanentes</button><button class="${V.dec?'on':''}" onclick="V.dec=true;render()">Dentes decíduos</button></div>
  <div class="card"><div id="odonto">${odontoGrid(p)}</div></div>
  <p class="hint">Escolha uma marcação acima e toque nas faces do dente (V vestibular, L lingual/palatina, M mesial, D distal, O oclusal/incisal). Toque no número do dente para ver os achados e adicioná-lo ao plano. As alterações são salvas automaticamente.</p>
  <div id="odosum">${odontoSummary(p)}</div>`;
}
function setTool(k){V.tool=k;document.querySelectorAll('.tools .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
function odontoGrid(p){
  const O=p.odonto||{};
  return `<div class="odo">${(V.dec?QDEC:QUADS).map(q=>`<div class="quad"><div class="quad-t">${q.t}</div><div class="teeth ${[1,4,5,8].includes(q.k)?'r':'l'}">${q.ids.map(n=>toothSvg(n,O[n])).join('')}</div></div>`).join('')}</div>`;
}
function toothSvg(n,d){
  d=d||{};const f=d.faces||{},w=d.whole;
  const q=Math.floor(n/10),upper=[1,2,5,6].includes(q),pr=[1,4,5,8].includes(q);
  const top=upper?'V':'L',bot=upper?'L':'V',lef=pr?'D':'M',rig=pr?'M':'D';
  const shapes=[[top,'1,1 39,1 29,11 11,11'],[bot,'1,39 39,39 29,29 11,29'],[lef,'1,1 11,11 11,29 1,39'],[rig,'39,1 29,11 29,29 39,39']];
  const fill=fc=>f[fc]?toolColor(f[fc]):'var(--tooth)';
  let s=shapes.map(([fc,pts])=>`<polygon points="${pts}" fill="${fill(fc)}" stroke="var(--tooth-line)" stroke-width="1.2" stroke-linejoin="round" onclick="paint(${n},'${fc}')"/>`).join('');
  s+=`<rect x="11" y="11" width="18" height="18" fill="${fill('O')}" stroke="var(--tooth-line)" stroke-width="1.2" onclick="paint(${n},'O')"/>`;
  s=`<g${w==='ausente'?' opacity=".4"':''}>${s}</g>`;
  const ov={
    canal:'<path d="M20 6V34" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>',
    coroa:'<rect x="2" y="2" width="36" height="36" rx="9" fill="none" stroke="#d97706" stroke-width="3.5"/>',
    implante:'<circle cx="20" cy="20" r="12" fill="#475569" opacity=".92"/><text x="20" y="23.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="sans-serif">IMP</text>',
    ext_ind:'<path d="M4 4L36 36M36 4L4 36" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>',
    ausente:'<path d="M4 4L36 36M36 4L4 36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>'}[w]||'';
  return `<div class="tooth"><svg viewBox="0 0 40 40" role="img" aria-label="Dente ${n}">${s}<g pointer-events="none">${ov}</g></svg><button class="n" onclick="toothModal(${n})">${n}</button></div>`;
}
function paint(n,face){
  const p=S.patients.find(x=>x.id===V.pid);if(!p)return;
  const O=p.odonto=p.odonto||{};const d=O[n]=O[n]||{faces:{}};d.faces=d.faces||{};
  const t=TOOLS.find(x=>x.k===V.tool);
  if(t.t==='face'){if(d.faces[face]===t.k)delete d.faces[face];else d.faces[face]=t.k;}
  else if(t.t==='whole'){d.whole=d.whole===t.k?null:t.k;}
  else{if(d.faces[face])delete d.faces[face];else d.whole=null;}
  if(!d.whole&&!Object.keys(d.faces).length)delete O[n];
  $('#odonto').innerHTML=odontoGrid(p);$('#odosum').innerHTML=odontoSummary(p);
  clearTimeout(V.st);V.st=setTimeout(()=>save('patients',p).then(()=>toast('Odontograma salvo.')),700);
}
function findText(d){
  const parts=[];if(d.whole)parts.push(toolName(d.whole));
  const by={};Object.entries(d.faces||{}).forEach(([fc,c])=>{(by[c]=by[c]||[]).push(fc);});
  Object.entries(by).forEach(([c,fs])=>parts.push(toolName(c)+' ('+fs.join('')+')'));
  return parts.join(', ');
}
function odontoSummary(p){
  const O=p.odonto||{},ks=Object.keys(O).sort((a,b)=>a-b);if(!ks.length)return '';
  return `<div class="card mt"><h3>Achados</h3><div class="finds">${ks.map(n=>`<button class="find" onclick="toothModal(${n})"><b>${n}</b> ${esc(findText(O[n]))}</button>`).join('')}</div></div>`;
}
function toothModal(n){
  const p=S.patients.find(x=>x.id===V.pid),d=(p.odonto||{})[n];
  const inPlan=S.plans.filter(x=>x.patient_id===p.id&&String(x.tooth)===String(n));
  modal(`<h2>Dente ${n}</h2><p class="muted">${d?esc(findText(d)):'Sem achados registrados.'}</p>
  ${inPlan.length?`<h3 class="mt">No plano de tratamento</h3>${inPlan.map(x=>`<div class="kv"><span>${esc(x.proc)}</span><b>${money(x.value)}</b></div>`).join('')}`:''}
  <div class="actions"><button class="btn danger" onclick="clearTooth(${n})">Limpar dente</button><button class="btn" onclick="planForm('','${p.id}',${n})">Adicionar ao plano</button></div>`);
}
function clearTooth(n){const p=S.patients.find(x=>x.id===V.pid);if(p&&p.odonto)delete p.odonto[n];save('patients',p);closeModal();render();}

/* ---------- plano de tratamento ---------- */
const PST={planejado:['Planejado','blue'],andamento:['Em andamento','warn'],concluido:['Concluído','ok']};
function tabPlano(p){
  const l=S.plans.filter(x=>x.patient_id===p.id).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));

const BST={pendente:['Pendente','warn'],aprovado:['Aprovado','ok'],recusado:['Recusado','rose']};
function bTot(b){
  const sub=(b.items||[]).reduce((s,i)=>s+(+i.qty||1)*(+i.value||0),0),disc=sub*(+b.discount||0)/100,total=Math.max(0,sub-disc);
  const entrada=Math.min(+b.entrada||0,total),n=Math.max(1,parseInt(b.installments)||1),rest=total-entrada;
  return {sub,disc,total,entrada,n,rest,parc:rest/n};
}
function budgetRow(b){
  const s=BST[b.status]||BST.pendente;
  return item({av:'#'+(b.num||'?'),t:esc(pname(b.patient_id)),s:fdate(b.created_at)+' · '+(b.items||[]).length+' itens',r:`${money(bTot(b).total)}<span class="tag ${s[1]}">${s[0]}</span>`,click:`openBudget('${b.id}','${V.screen==='patient'?'patient':'list'}')`});
}
function scrBudgets(){

  (l.length?lst(l.map(budgetRow).join('')):empty('Nenhum orçamento por aqui. Crie um a partir do plano de tratamento de um paciente ou toque em “Novo orçamento”.'));

async function saveBudget(){
  const b=V.bud;
  if(!b.patient_id)return toast('Selecione o paciente.',true);
  const items=b.items.filter(i=>i.description&&i.description.trim());
  if(!items.length)return toast('Adicione pelo menos um procedimento.',true);
  const {isNew,...row}=b;row.items=items;
  const gen=row.status==='aprovado'&&!row.generated&&bTot(row).total>0&&confirm('Lançar a entrada e as parcelas no financeiro como valores a receber?');
  if(gen)row.generated=true;
  await save('budgets',row);
  if(gen){await genInstallments(row);}
  toast(gen?'Orçamento salvo e parcelas lançadas.':'Orçamento salvo.');
  V.bud={...row};backBudget();
}
async function genInstallments(b){
  const t=bTot(b),n=t.n,due=b.first_due||today(),desc='Orçamento #'+b.num,rows=[];
  if(t.entrada>0)rows.push({description:desc+' – entrada',value:+t.entrada.toFixed(2),date:due});
  const rest=+(t.total-t.entrada).toFixed(2),base=Math.floor(rest/n*100)/100;
  for(let i=0;i<n;i++){
    const v=i===n-1?+(rest-base*(n-1)).toFixed(2):base;
    if(v>0)rows.push({description:`${desc} – parcela ${i+1}/${n}`,value:v,date:addMonths(due,i+(t.entrada>0?1:0))});
  }
  await bulkInsert('tx',rows.map(r=>({id:uid(),type:'entrada',category:'Procedimento',status:'pendente',method:null,patient_id:b.patient_id,budget_id:b.id,...r})));
}

/* ---------- agenda: calendário mensal e semanal ---------- */
const AST={agendado:['Agendado','blue'],confirmado:['Confirmado','ok'],concluido:['Concluído','gray'],faltou:['Faltou','rose'],cancelado:['Cancelado','gray']};
const tmin=a=>{const [h,m]=String(a.time||'09:00').split(':').map(Number);return (h||0)*60+(m||0);};
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const apptsOn=d=>S.appts.filter(a=>a.date===d).sort((a,b)=>tmin(a)-tmin(b));
function apptRow(a){const s=AST[a.status]||AST.agendado;return item({av:esc(a.time||'—'),t:esc(pname(a.patient_id)),s:esc(a.proc||'Consulta')+(V.screen!=='agenda'?' · '+fdate(a.date):''),r:`<span class="tag ${s[1]}">${s[0]}</span>`,click:`apptForm('${a.id}')`});}
function calShift(n){V.agendaDate=V.aview==='month'?addMonths(V.agendaDate,n):addDays(V.agendaDate,7*n);render();}
function scrAgenda(){
  const d=V.agendaDate,dt=new Date(d+'T00:00:00');let title;
  if(V.aview==='month')title=MONTHS[dt.getMonth()]+' de '+dt.getFullYear();
  else{const s=addDays(d,-dt.getDay()),e=addDays(s,6);title=`${+s.slice(8)} ${M3[+s.slice(5,7)-1]} – ${+e.slice(8)} ${M3[+e.slice(5,7)-1]} ${e.slice(0,4)}`;}
  return head('Agenda',null,`<button class="btn" onclick="apptForm()">${ic('plus',16)} Agendar</button>`)+
  `<div class="cal-tools"><div class="seg"><button class="${V.aview==='month'?'on':''}" onclick="V.aview='month';render()">Mês</button><button class="${V.aview==='week'?'on':''}" onclick="V.aview='week';render()">Semana</button></div>
   <div class="row"><button class="icon" onclick="calShift(-1)" aria-label="Anterior">${ic('back',20)}</button><b class="ctitle">${title}</b><button class="icon" style="transform:scaleX(-1)" onclick="calShift(1)" aria-label="Próximo">${ic('back',20)}</button></div>
   <button class="btn ghost sm" onclick="V.agendaDate=today();render()">Hoje</button></div>
  ${V.aview==='month'?monthView():weekView()}
  <div class="legend">${Object.entries(AST).map(([k,v])=>`<span class="st-${k}"><i style="background:var(--sc)"></i>${v[0]}</span>`).join('')}</div>`;
}
function monthView(){
  const d=new Date(V.agendaDate+'T00:00:00'),y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((first.getDay()+dim)/7),t=today();
  let cells='';
  for(let i=0;i<rows*7;i++){
    const dt=new Date(y,m,1-first.getDay()+i),ds=iso(dt),l=apptsOn(ds),off=dt.getMonth()!==m;
    cells+=`<div class="cd ${off?'off':''} ${ds===t?'today':''}" onclick="dayModal('${ds}')"><span class="dn">${dt.getDate()}</span>
    <div class="evs">${l.slice(0,3).map(a=>`<button class="ev st-${a.status}" onclick="event.stopPropagation();apptForm('${a.id}')">${esc(a.time||'')} ${esc(short(pname(a.patient_id)))}</button>`).join('')}${l.length>3?`<span class="more">+${l.length-3} mais</span>`:''}</div>
    <div class="dots">${l.slice(0,5).map(a=>`<i class="dot st-${a.status}"></i>`).join('')}${l.length>5?'<small>+</small>':''}</div></div>`;
  }
  return `<div class="cal"><div class="cal-h">${DOW.map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-g">${cells}</div></div>`;
}
function layoutDay(list){
  list.sort((x,y)=>x.start-y.start||x.end-y.end);
  const cols=[],out=[];let cluster=[],cEnd=0;
  const flush=()=>{const n=Math.max(1,...cluster.map(c=>c.col+1));cluster.forEach(c=>{c.n=n;out.push(c);});cluster=[];cols.length=0;};
  list.forEach(ev=>{
    if(cluster.length&&ev.start>=cEnd)flush();
    let c=cols.findIndex(e=>e<=ev.start);if(c<0){c=cols.length;cols.push(0);}
    cols[c]=ev.end;ev.col=c;cluster.push(ev);cEnd=Math.max(cEnd,ev.end);
  });
  flush();return out;
}
function weekView(){
  const d=new Date(V.agendaDate+'T00:00:00'),s=addDays(V.agendaDate,-d.getDay()),days=Array.from({length:7},(_,i)=>addDays(s,i)),t=today();
  let h0=7,h1=20;S.appts.filter(a=>days.includes(a.date)).forEach(a=>{h0=Math.min(h0,Math.floor(tmin(a)/60));h1=Math.max(h1,Math.ceil((tmin(a)+(+a.duration||30))/60));});
  const HH=56,H=(h1-h0)*HH,now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  let g='<div class="hd"></div>'+days.map((x,i)=>`<div class="hd ${x===t?'today':''}">${DOW[i]}<b>${+x.slice(8)}</b></div>`).join('');
  g+=`<div class="tm" style="height:${H}px">${Array.from({length:h1-h0},(_,i)=>`<span style="top:${i*HH}px">${String(h0+i).padStart(2,'0')}:00</span>`).join('')}</div>`;
  days.forEach(x=>{
    const ev=layoutDay(apptsOn(x).map(a=>({a,start:tmin(a),end:tmin(a)+(+a.duration||30)})));
    const nl=(x===t&&nowMin>=h0*60&&nowMin<=h1*60)?`<div class="now" style="top:${(nowMin-h0*60)/60*HH}px"></div>`:'';
    g+=`<div class="col" style="height:${H}px" onclick="weekClick(event,'${x}',${h0},${HH})">${nl}${ev.map(e=>{
      const top=(e.start-h0*60)/60*HH,ht=Math.max(24,(e.end-e.start)/60*HH-2);
      return `<div class="blk st-${e.a.status}" style="top:${top}px;height:${ht}px;left:calc(${e.col/e.n*100}% + 2px);width:calc(${100/e.n}% - 4px)" onclick="event.stopPropagation();apptForm('${e.a.id}')"><b>${esc(e.a.time||'')}</b> ${esc(short(pname(e.a.patient_id)))}${ht>46?`<div class="bs">${esc(e.a.proc||'')}</div>`:''}</div>`;}).join('')}</div>`;
  });
  return `<div class="wkwrap"><div class="wk" style="--hh:${HH}px">${g}</div></div>`;
}
function weekClick(e,d,h0,HH){
  const r=e.currentTarget.getBoundingClientRect(),mins=h0*60+Math.floor((e.clientY-r.top)/HH*2)*30;
  apptForm('','',d,hhmm(Math.max(0,mins)));
}
function dayModal(d){
  const l=apptsOn(d);

function group(list,key){const m={};list.forEach(x=>{const k=x[key]||'Sem categoria';m[k]=(m[k]||0)+Number(x.value||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function hbars(arr){
  if(!arr.length)return '<p class="muted" style="margin:6px 0 0">Sem dados no período.</p>';
  const mx=arr[0][1]||1;
  return arr.slice(0,7).map(([k,v])=>`<div class="hb"><span title="${esc(k)}">${esc(k)}</span><div class="bar"><i style="width:${Math.max(3,v/mx*100)}%"></i></div><b>${money(v)}</b></div>`).join('');
}
function periodRange(){const end=today().slice(0,7),start=shiftMonth(end,-(V.period-1));return {end,start,months:Array.from({length:V.period},(_,i)=>shiftMonth(start,i))};}
function scrReports(){
  const {end,start,months}=periodRange();
  const inR=d=>{const m=(d||'').slice(0,7);return m>=start&&m<=end;};
  const tx=S.tx.filter(x=>inR(x.date)),pagos=tx.filter(x=>x.status==='pago');
  const ent=sum(pagos.filter(x=>x.type==='entrada')),desp=sum(pagos.filter(x=>x.type==='despesa')),res=ent-desp;
  const byM=months.map(m=>({m,e:sum(pagos.filter(x=>x.type==='entrada'&&x.date.slice(0,7)===m)),d:sum(pagos.filter(x=>x.type==='despesa'&&x.date.slice(0,7)===m))}));
  const mx=Math.max(1,...byM.flatMap(x=>[x.e,x.d]));
  const bs=S.budgets.filter(b=>inR(b.created_at)),apr=bs.filter(b=>b.status==='aprovado');
  const done=S.plans.filter(x=>x.status==='concluido'),byProc={};
  done.forEach(x=>{const k=x.proc||'—';byProc[k]=byProc[k]||{n:0,v:0};byProc[k].n++;byProc[k].v+=Number(x.value||0);});
  const topProc=Object.entries(byProc).sort((a,b)=>b[1].v-a[1].v).slice(0,6);
  const atras=S.tx.filter(x=>x.type==='entrada'&&x.status==='pendente'&&x.date&&x.date<today());
  const novos=S.patients.filter(p=>inR(p.created_at)).length;
  const per=[[1,'Este mês'],[3,'3 meses'],[6,'6 meses'],[12,'12 meses']];
  return head('Relatórios',"nav('more')",`<button class="btn ghost" onclick="exportCsv()">${ic('save',16)} Exportar CSV</button>`)+
  `<div class="chips">${per.map(([n,t])=>`<button class="chip ${V.period===n?'on':''}" onclick="V.period=${n};render()">${t}</button>`).join('')}</div>
  <div class="grid4"><div class="card sage stat"><span>Entradas recebidas</span><b class="pos">${money(ent)}</b></div><div class="card stat"><span>Despesas pagas</span><b class="neg">${money(desp)}</b></div>
  <div class="card stat"><span>Resultado</span><b class="${res>=0?'pos':'neg'}">${money(res)}</b></div><div class="card stat"><span>Margem</span><b>${ent?Math.round(res/ent*100):0}%</b></div></div>
  <div class="cols">
  <div class="card"><h3>Fluxo de caixa por mês</h3><div class="bars mt">${byM.map(x=>`<div class="bcol"><div class="bpair"><i style="height:${x.e/mx*100}px;background:var(--moss)" title="Entradas ${money(x.e)}"></i><i style="height:${x.d/mx*100}px;background:var(--rose)" title="Despesas ${money(x.d)}"></i></div><small>${M3[+x.m.slice(5,7)-1]}</small></div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--moss)"></i>Entradas</span><span><i style="background:var(--rose)"></i>Despesas</span></div></div>
  <div class="card"><h3>Orçamentos do período</h3>
   <div class="kv"><span>Criados</span><b>${bs.length}</b></div><div class="kv"><span>Aprovados</span><b>${apr.length}${bs.length?' ('+Math.round(apr.length/bs.length*100)+'%)':''}</b></div>
   <div class="kv"><span>Valor aprovado</span><b>${money(apr.reduce((s,b)=>s+bTot(b).total,0))}</b></div>
   <div class="kv"><span>Aguardando resposta</span><b>${money(bs.filter(b=>b.status==='pendente').reduce((s,b)=>s+bTot(b).total,0))}</b></div></div>
  <div class="card"><h3>Despesas por categoria</h3>${hbars(group(pagos.filter(x=>x.type==='despesa'),'category'))}</div>
  <div class="card"><h3>Entradas por categoria</h3>${hbars(group(pagos.filter(x=>x.type==='entrada'),'category'))}</div>
  <div class="card"><h3>Entradas por forma de pagamento</h3>${hbars(group(pagos.filter(x=>x.type==='entrada'),'method'))}</div>
  <div class="card"><h3>Procedimentos concluídos (todo o histórico)</h3>${topProc.length?topProc.map(([k,v])=>`<div class="kv"><span>${esc(k)} · ${v.n}×</span><b>${money(v.v)}</b></div>`).join(''):'<p class="muted" style="margin:6px 0 0">Marque procedimentos do plano como concluídos para vê-los aqui.</p>'}</div>
  <div class="card"><h3>Pacientes e inadimplência</h3>
   <div class="kv"><span>Pacientes cadastrados</span><b>${S.patients.length}</b></div><div class="kv"><span>Novos no período</span><b>${novos}</b></div>
   <div class="kv"><span>Recebimentos em atraso</span><b class="${atras.length?'neg':''}">${money(sum(atras))} (${atras.length})</b></div></div></div>`;
}
function exportCsv(){
  const {start,end}=periodRange(),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=S.tx.filter(x=>{const m=(x.date||'').slice(0,7);return m>=start&&m<=end;}).sort((a,b)=>a.date.localeCompare(b.date));
  const csv='\uFEFF'+['Data','Tipo','Descrição','Categoria','Forma','Paciente','Situação','Valor'].map(q).join(';')+'\n'+
   rows.map(x=>[fdate(x.date),x.type,x.description,x.category,x.method,x.patient_id?pname(x.patient_id):'',x.status,String(x.value).replace('.',',')].map(q).join(';')).join('\n');
  download(`financeiro-${start}-a-${end}.csv`,csv,'text/csv;charset=utf-8');
}

      {type:'despesa',description:'Aluguel da sala',category:'Aluguel',value:1800,date:d,status:'pago',method:'Boleto'},

  tx.push({type:'entrada',description:'Coroa – parcela 2/3',category:'Procedimento',value:500,date:addMonths(today(),-1),status:'pendente',method:null,patient_id:P[0].id},{type:'entrada',description:'Coroa – parcela 3/3',category:'Procedimento',value:500,date:addMonths(today(),1),status:'pendente',method:null,patient_id:P[0].id});
  await bulkInsert('tx',tx.map(x=>({id:uid(),patient_id:null,budget_id:null,...x})));
  const ap=(i,d,time,dur,proc,status)=>({id:uid(),patient_id:P[i].id,date:addDays(today(),d),time,duration:dur,proc,status});
  await bulkInsert('appts',[
    ap(0,0,'09:00',60,'Restauração de resina - 2 faces','confirmado'),ap(2,0,'14:30',30,'Consulta / avaliação','agendado'),ap(3,0,'09:30',30,'Profilaxia (limpeza)','agendado'),
    ap(1,1,'10:00',30,'Profilaxia (limpeza)','agendado'),ap(4,1,'15:00',90,'Tratamento de canal (endodontia)','confirmado'),
    ap(5,2,'08:30',45,'Extração de siso','agendado'),ap(0,2,'11:00',30,'Manutenção ortodôntica','agendado'),ap(3,3,'16:00',60,'Clareamento dental','confirmado'),
    ap(2,4,'09:00',30,'Consulta / avaliação','agendado'),ap(1,4,'09:00',60,'Restauração de resina - 3 faces','agendado'),ap(4,5,'10:30',30,'Aplicação de flúor','agendado'),
    ap(5,-1,'14:00',60,'Coroa protética','concluido'),ap(3,-2,'11:00',30,'Consulta / avaliação','faltou'),ap(2,-3,'15:30',30,'Manutenção ortodôntica','concluido'),
    ap(0,7,'09:00',60,'Coroa protética','agendado'),ap(1,9,'14:00',30,'Consulta / avaliação','agendado'),ap(4,12,'10:00',60,'Restauração de resina - 2 faces','agendado'),ap(5,15,'16:00',30,'Profilaxia (limpeza)','cancelado'),ap(3,-8,'09:00',30,'Consulta / avaliação','concluido')]);
  render();toast('Dados de exemplo adicionados.');
}

(async function boot(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase){
    LOCAL=false;sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data}=await sb.auth.getSession();
    if(data.session){user=data.session.user;await afterLogin();}else renderAuth();
  }else{LOCAL=true;loadLocal();loadClinic();await seedProcsIfEmpty();render();}
})();

</script>
