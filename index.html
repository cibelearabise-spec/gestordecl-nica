<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>Gestor Odonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f7;--card:#ffffff;--ink:#0c2a33;--muted:#5f7780;--line:#dde6e9;
  --brand:#0e7c86;--brand-d:#0a5f67;--on-brand:#ffffff;--tint:#ddf0f1;
  --rose:#d9485f;--rose-t:#fbe4e8;--ok:#178a4c;--ok-t:#dcf3e5;--warn:#a85f00;--warn-t:#fdf0d6;--blue:#2f6fdb;--blue-t:#e2ebfb;
  --tooth:#fbfdfd;--tooth-line:#8aa3ab;--r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#091a1f;--card:#10262d;--ink:#e6f1f3;--muted:#8fa9b1;--line:#1f3b44;
    --brand:#3cc0c9;--brand-d:#7fdde3;--on-brand:#06282c;--tint:#123a41;
    --rose:#ff7b90;--rose-t:#3a1a22;--ok:#4cd08a;--ok-t:#12372a;--warn:#f0b04a;--warn-t:#3a2c10;--blue:#7aa8ff;--blue-t:#172a4d;
    --tooth:#1a343c;--tooth-line:#5d7e88}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:21px;margin-bottom:4px}h3{font-size:16px}
a{color:var(--brand-d)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.mt{margin-top:14px}.mb{margin-bottom:10px}
.sp{flex:1;min-width:0}
.c{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.row input{width:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pre{white-space:pre-wrap;margin:6px 0 0}
.hint{color:var(--muted);font-size:13px;margin:10px 2px}
.banner{background:var(--warn-t);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.head h1.sm{font-size:19px;line-height:1.2}
.icon{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat span{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:22px;display:block;margin-top:2px}
.stat small{color:var(--muted);font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--rose)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1.5px dashed var(--line);border-radius:14px}
/* botões */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.ghost{background:var(--tint);color:var(--brand-d)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--rose-t);color:var(--rose)}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}
/* formulários */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px;color:var(--muted)}
.search input{border:0;box-shadow:none!important;padding:11px 0;background:transparent}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* chips e tags */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--brand-d);white-space:nowrap}
.tag.ok{background:var(--ok-t);color:var(--ok)}.tag.warn{background:var(--warn-t);color:var(--warn)}
.tag.rose{background:var(--rose-t);color:var(--rose)}.tag.blue{background:var(--blue-t);color:var(--blue)}
.tag.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* listas */
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.av{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--brand-d);display:grid;place-items:center;font-weight:800;font-size:13px;overflow:hidden}
.av.lg{width:46px;height:46px;font-size:16px;border-radius:50%}
.av.in{background:var(--ok-t);color:var(--ok)}.av.out{background:var(--rose-t);color:var(--rose)}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-weight:700}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;color:var(--ink);cursor:pointer;font-size:15px}
.menu .mi{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--brand-d);display:grid;place-items:center;flex:none}
.menu small{display:block;color:var(--muted);font-size:12.5px}
.menu>svg:last-child{color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.qa svg{color:var(--brand)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:760px;margin:0 auto}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px 9px;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button.on{color:var(--brand)}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(6,20,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--rose);color:#fff}
/* odontograma */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px}
.odo{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.odo{grid-template-columns:1fr 1fr;gap:18px 0}.quad:nth-child(odd){border-right:2px solid var(--line);padding-right:8px}.quad:nth-child(even){padding-left:8px}}
.quad-t{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 4px 2px}
.teeth{display:flex}.teeth.r{justify-content:flex-end}.teeth.l{justify-content:flex-start}
.tooth{flex:0 0 12.5%;min-width:0;text-align:center}
.tooth svg{width:100%;max-width:46px;height:auto;display:block;margin:0 auto;cursor:pointer}
.tooth .n{font-size:12px;font-weight:800;color:var(--muted);background:none;border:0;padding:3px 0 2px;cursor:pointer}
.finds{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.find{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
/* orçamento */
.bi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.bi .g{display:grid;grid-template-columns:1fr 1fr 2fr;gap:6px;margin-top:4px}
.bi small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px}
.tot{border-top:1px dashed var(--line);margin-top:12px;padding-top:6px}
.tot .kv{border:0;padding:4px 0}.tot .big{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:22px}
/* gráficos */
.bars{display:flex;gap:6px;align-items:flex-end}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bpair{display:flex;align-items:flex-end;gap:3px;height:104px;justify-content:center;width:100%}
.bpair i{display:block;width:40%;max-width:16px;border-radius:4px 4px 0 0;min-height:2px}
.bcol small{font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:9px;border-radius:5px;background:var(--tint);overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
/* login */
.auth{max-width:420px;padding-top:calc(60px + env(safe-area-inset-top,0px))}
.logo{width:64px;height:64px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;margin-bottom:14px}
.auth p{margin:6px 0 18px}
/* impressão */
#printdoc{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,#toast,#modal-root{display:none!important}
  #printdoc{display:block;padding:24px;font-family:Figtree,Arial,sans-serif;font-size:13px}
  #printdoc table{width:100%;border-collapse:collapse;margin:14px 0}
  #printdoc th,#printdoc td{border-bottom:1px solid #999;padding:6px 4px;text-align:left}
  #printdoc .r{text-align:right}
  #printdoc .sign{margin-top:70px;display:flex;gap:40px}
  #printdoc .sign div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="printdoc"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Project Settings → API). Deixe vazio para usar o modo local.
   ============================================================ */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* ---------- utilidades ---------- */
const T = {patients:'gestor_patients',plans:'gestor_plan_items',budgets:'gestor_budgets',tx:'gestor_transactions',appts:'gestor_appointments',procs:'gestor_procedures'};
const LS='gestor_odonto_v1', LSC='gestor_odonto_clinic';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const fdate=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sum=a=>a.reduce((s,x)=>s+Number(x.value||0),0);
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const mlabel=m=>MONTHS[+m.slice(5,7)-1]+' de '+m.slice(0,4);
const shiftMonth=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1)).slice(0,7);
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return iso(dt);}
const digits=s=>String(s||'').replace(/\D/g,'');
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const pname=id=>{const p=S.patients.find(x=>x.id===id);return p?p.name:'—';};
function waLink(phone,text){let d=digits(phone);if(d&&d.length<=11)d='55'+d;return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'');}
const opts=(l,sel)=>l.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`;}).join('');
const patOpts=sel=>opts([['','Selecione…'],...[...S.patients].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(p=>[p.id,p.name])],sel||'');
const procList=()=>`<datalist id="dl_procs">${S.procs.map(o=>`<option value="${esc(o.name)}">`).join('')}</datalist>`;
const val=id=>{const e=document.getElementById('f_'+id);return e?e.value:'';};
const num=id=>parseFloat(String(val(id)).replace(',','.'))||0;
const empty=m=>`<div class="empty">${m}</div>`;
const IC={
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.6c2 .6 3.5 2.4 3.5 5.4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  wallet:'<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><circle cx="17" cy="14.5" r="1.2"/>',
  dots:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  chart:'<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
  tooth:'<path d="M7 3.5c-2.5 0-4 2-4 4.4 0 2 .8 3.3 1.5 5 .7 1.7.6 4 1.3 6.5.3 1.2 1.8 1.2 2.2 0 .6-2 .9-4 2-4s1.4 2 2 4c.4 1.2 1.9 1.2 2.2 0 .7-2.5.6-4.8 1.3-6.5.7-1.7 1.5-3 1.5-5C21 5.500 19.500 3.500 17 3.500c-1.700 0-2.500 1-5 1s-3.300-1-5-1z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M18.700 5.300l-2.100 2.100M7.400 16.600l-2.100 2.100"/>',
  out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
  save:'<path d="M12 3v12M8 11l4 4 4-4M5 20h14"/>',
  send:'<path d="M12 15V3M8 7l4-4 4 4M5 14v6h14v-6"/>'
};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>{t.className='';},2800);}
function modal(html){$('#modal-root').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeModal()"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){$('#modal-root').innerHTML='';}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}

/* ---------- estado e dados ---------- */
let sb=null,LOCAL=true,user=null,CLINIC={};
let S={patients:[],plans:[],budgets:[],tx:[],appts:[],procs:[]};
const V={screen:'home',pid:null,ptab:'dados',q:'',tool:'carie',dec:false,month:today().slice(0,7),ftype:'todas',agendaDate:today(),bfilter:'todos',period:6,bud:null,bfrom:'list',txType:'entrada'};
const DEF_PROCS=[['Consulta / avaliação',150],['Profilaxia (limpeza)',180],['Restauração de resina - 1 face',200],['Restauração de resina - 2 faces',280],['Restauração de resina - 3 faces',350],['Tratamento de canal (endodontia)',900],['Extração simples',250],['Extração de siso',500],['Coroa protética',1500],['Implante unitário',3500],['Clareamento dental',900],['Faceta de resina',600],['Raspagem periodontal (por sextante)',150],['Aplicação de flúor',80],['Selante',90],['Instalação de aparelho ortodôntico',1200],['Manutenção ortodôntica',180],['Alinhadores ortodônticos (plano)',8000],['Radiografia periapical',40],['Radiografia panorâmica',120]];

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS));if(d)S={...S,...d};}catch(e){}}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function loadClinic(){try{CLINIC=JSON.parse(localStorage.getItem(LSC))||{};}catch(e){CLINIC={};}if(!LOCAL&&user&&user.user_metadata&&user.user_metadata.clinic)CLINIC=user.user_metadata.clinic;}
async function loadRemote(){
  const keys=Object.keys(T);
  const res=await Promise.all(keys.map(k=>sb.from(T[k]).select('*').order('created_at',{ascending:true})));
  keys.forEach((k,i)=>{if(res[i].error)toast('Erro ao carregar '+k+': '+res[i].error.message,true);else S[k]=res[i].data;});
}
async function save(kind,obj){
  const row={...obj};Object.keys(row).forEach(k=>{if(row[k]==='')row[k]=null;});
  if(!row.id)row.id=uid();
  const arr=S[kind];const i=arr.findIndex(x=>x.id===row.id);
  if(i<0&&!row.created_at)row.created_at=new Date().toISOString();
  const full=i>=0?{...arr[i],...row}:row;
  if(i>=0)arr[i]=full;else arr.push(full);
  if(LOCAL)persistLocal();
  else{const {error}=await sb.from(T[kind]).upsert(full);if(error)toast('Erro ao salvar: '+error.message,true);}
  return full;
}
async function bulkInsert(kind,rows){
  rows=rows.map((r,i)=>({created_at:new Date(Date.now()+i).toISOString(),...r}));
  if(LOCAL){S[kind].push(...rows);persistLocal();return;}
  const {data,error}=await sb.from(T[kind]).insert(rows).select();
  if(error){toast('Erro ao salvar: '+error.message,true);return;}
  S[kind].push(...data);
}
async function del(kind,id){
  S[kind]=S[kind].filter(x=>x.id!==id);
  if(kind==='patients'){S.plans=S.plans.filter(x=>x.patient_id!==id);S.budgets=S.budgets.filter(x=>x.patient_id!==id);S.appts=S.appts.filter(x=>x.patient_id!==id);S.tx.forEach(x=>{if(x.patient_id===id)x.patient_id=null;});}
  if(kind==='budgets')S.tx.forEach(x=>{if(x.budget_id===id)x.budget_id=null;});
  if(LOCAL)persistLocal();
  else{const {error}=await sb.from(T[kind]).delete().eq('id',id);if(error)toast('Erro ao excluir: '+error.message,true);}
}
async function delItem(kind,id){if(!confirm('Excluir este item?'))return;await del(kind,id);closeModal();render();toast('Excluído.');}
async function seedProcsIfEmpty(){if(S.procs.length)return;await bulkInsert('procs',DEF_PROCS.map(([name,value])=>({id:uid(),name,value})));}

async function doAuth(mode){
  const email=$('#a_email').value.trim(),password=$('#a_pass').value,msg=$('#a_msg');
  if(!email||password.length<6){msg.textContent='Informe o e-mail e uma senha com pelo menos 6 caracteres.';return;}
  msg.textContent='Aguarde…';
  try{
    if(mode==='up'){
      const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;
      if(!data.session){msg.textContent='Conta criada. Confirme o e-mail que enviamos e depois toque em Entrar.';return;}
      user=data.user;
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;

    await afterLogin();

    const m=e.message||'';

}

/* ---------- odontograma ---------- */
const TOOLS=[
 {k:'carie',l:'Cárie',c:'#ef4444',t:'face'},{k:'restauracao',l:'Restauração',c:'#3b82f6',t:'face'},
 {k:'fratura',l:'Fratura',c:'#f59e0b',t:'face'},{k:'selante',l:'Selante',c:'#22c55e',t:'face'},
 {k:'canal',l:'Endodontia',c:'#7c3aed',t:'whole'},{k:'coroa',l:'Coroa',c:'#d97706',t:'whole'},
 {k:'implante',l:'Implante',c:'#475569',t:'whole'},{k:'ext_ind',l:'Extração indicada',c:'#dc2626',t:'whole'},
 {k:'ausente',l:'Ausente',c:'#94a3b8',t:'whole'},{k:'limpar',l:'Borracha',c:'#0e7c86',t:'clear'}];
const rng=(a,b)=>Array.from({length:Math.abs(b-a)+1},(_,i)=>a<=b?a+i:a-i);
const QUADS=[{k:1,ids:rng(18,11),t:'Superior direito'},{k:2,ids:rng(21,28),t:'Superior esquerdo'},{k:4,ids:rng(48,41),t:'Inferior direito'},{k:3,ids:rng(31,38),t:'Inferior esquerdo'}];
const QDEC=[{k:5,ids:rng(55,51),t:'Superior direito'},{k:6,ids:rng(61,65),t:'Superior esquerdo'},{k:8,ids:rng(85,81),t:'Inferior direito'},{k:7,ids:rng(71,75),t:'Inferior esquerdo'}];
const toolName=k=>(TOOLS.find(t=>t.k===k)||{}).l||k;
const toolColor=k=>(TOOLS.find(t=>t.k===k)||{}).c||'#999';
function tabOdonto(p){
  return `<div class="chips tools">${TOOLS.map(t=>`<button class="chip ${V.tool===t.k?'on':''}" data-k="${t.k}" onclick="setTool('${t.k}')"><i style="background:${t.c}"></i>${t.l}</button>`).join('')}</div>
  <div class="seg mb"><button class="${!V.dec?'on':''}" onclick="V.dec=false;render()">Dentes permanentes</button><button class="${V.dec?'on':''}" onclick="V.dec=true;render()">Dentes decíduos</button></div>
  <div class="card"><div id="odonto">${odontoGrid(p)}</div></div>
  <p class="hint">Escolha uma marcação acima e toque nas faces do dente (V vestibular, L lingual/palatina, M mesial, D distal, O oclusal/incisal). Toque no número do dente para ver os achados e adicioná-lo ao plano. As alterações são salvas automaticamente.</p>
  <div id="odosum">${odontoSummary(p)}</div>`;
}
function setTool(k){V.tool=k;document.querySelectorAll('.tools .chip').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
function odontoGrid(p){
  const O=p.odonto||{};
  return `<div class="odo">${(V.dec?QDEC:QUADS).map(q=>`<div class="quad"><div class="quad-t">${q.t}</div><div class="teeth ${[1,4,5,8].includes(q.k)?'r':'l'}">${q.ids.map(n=>toothSvg(n,O[n])).join('')}</div></div>`).join('')}</div>`;
}
function toothSvg(n,d){
  d=d||{};const f=d.faces||{},w=d.whole;
  const q=Math.floor(n/10),upper=[1,2,5,6].includes(q),pr=[1,4,5,8].includes(q);
  const top=upper?'V':'L',bot=upper?'L':'V',lef=pr?'D':'M',rig=pr?'M':'D';
  const shapes=[[top,'1,1 39,1 29,11 11,11'],[bot,'1,39 39,39 29,29 11,29'],[lef,'1,1 11,11 11,29 1,39'],[rig,'39,1 29,11 29,29 39,39']];
  const fill=fc=>f[fc]?toolColor(f[fc]):'var(--tooth)';
  let s=shapes.map(([fc,pts])=>`<polygon points="${pts}" fill="${fill(fc)}" stroke="var(--tooth-line)" stroke-width="1.2" stroke-linejoin="round" onclick="paint(${n},'${fc}')"/>`).join('');
  s+=`<rect x="11" y="11" width="18" height="18" fill="${fill('O')}" stroke="var(--tooth-line)" stroke-width="1.2" onclick="paint(${n},'O')"/>`;
  s=`<g${w==='ausente'?' opacity=".4"':''}>${s}</g>`;
  const ov={
    canal:'<path d="M20 6V34" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>',
    coroa:'<rect x="2" y="2" width="36" height="36" rx="9" fill="none" stroke="#d97706" stroke-width="3.5"/>',
    implante:'<circle cx="20" cy="20" r="12" fill="#475569" opacity=".92"/><text x="20" y="23.500" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="sans-serif">IMP</text>',
    ext_ind:'<path d="M4 4L36 36M36 4L4 36" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>',
    ausente:'<path d="M4 4L36 36M36 4L4 36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>'}[w]||'';
  return `<div class="tooth"><svg viewBox="0 0 40 40" role="img" aria-label="Dente ${n}">${s}<g pointer-events="none">${ov}</g></svg><button class="n" onclick="toothModal(${n})">${n}</button></div>`;
}
function paint(n,face){
  const p=S.patients.find(x=>x.id===V.pid);if(!p)return;
  const O=p.odonto=p.odonto||{};const d=O[n]=O[n]||{faces:{}};d.faces=d.faces||{};
  const t=TOOLS.find(x=>x.k===V.tool);
  if(t.t==='face'){if(d.faces[face]===t.k)delete d.faces[face];else d.faces[face]=t.k;}
  else if(t.t==='whole'){d.whole=d.whole===t.k?null:t.k;}
  else{if(d.faces[face])delete d.faces[face];else d.whole=null;}
  if(!d.whole&&!Object.keys(d.faces).length)delete O[n];
  $('#odonto').innerHTML=odontoGrid(p);$('#odosum').innerHTML=odontoSummary(p);
  clearTimeout(V.st);V.st=setTimeout(()=>save('patients',p).then(()=>toast('Odontograma salvo.')),700);
}
function findText(d){
  const parts=[];if(d.whole)parts.push(toolName(d.whole));
  const by={};Object.entries(d.faces||{}).forEach(([fc,c])=>{(by[c]=by[c]||[]).push(fc);});
  Object.entries(by).forEach(([c,fs])=>parts.push(toolName(c)+' ('+fs.join('')+')'));
  return parts.join(', ');
}
function odontoSummary(p){
  const O=p.odonto||{},ks=Object.keys(O).sort((a,b)=>a-b);if(!ks.length)return '';
  return `<div class="card mt"><h3>Achados</h3><div class="finds">${ks.map(n=>`<button class="find" onclick="toothModal(${n})"><b>${n}</b> ${esc(findText(O[n]))}</button>`).join('')}</div></div>`;
}
function toothModal(n){
  const p=S.patients.find(x=>x.id===V.pid),d=(p.odonto||{})[n];
  const inPlan=S.plans.filter(x=>x.patient_id===p.id&&String(x.tooth)===String(n));
  modal(`<h2>Dente ${n}</h2><p class="muted">${d?esc(findText(d)):'Sem achados registrados.'}</p>
  ${inPlan.length?`<h3 class="mt">No plano de tratamento</h3>${inPlan.map(x=>`<div class="kv"><span>${esc(x.proc)}</span><b>${money(x.value)}</b></div>`).join('')}`:''}
  <div class="actions"><button class="btn danger" onclick="clearTooth(${n})">Limpar dente</button><button class="btn" onclick="planForm('','${p.id}',${n})">Adicionar ao plano</button></div>`);
}
function clearTooth(n){const p=S.patients.find(x=>x.id===V.pid);if(p&&p.odonto)delete p.odonto[n];save('patients',p);closeModal();render();}

/* ---------- plano de tratamento ---------- */
const PST={planejado:['Planejado','blue'],andamento:['Em andamento','warn'],concluido:['Concluído','ok']};
function tabPlano(p){
  const l=S.plans.filter(x=>x.patient_id===p.id).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));

/* ---------- orçamentos ---------- */
const BST={pendente:['Pendente','warn'],aprovado:['Aprovado','ok'],recusado:['Recusado','rose']};
function bTot(b){
  const sub=(b.items||[]).reduce((s,i)=>s+(+i.qty||1)*(+i.value||0),0),disc=sub*(+b.discount||0)/100,total=Math.max(0,sub-disc);
  const entrada=Math.min(+b.entrada||0,total),n=Math.max(1,parseInt(b.installments)||1),rest=total-entrada;
  return {sub,disc,total,entrada,n,rest,parc:rest/n};
}
function budgetRow(b){
  const s=BST[b.status]||BST.pendente;
  return item({av:'#'+(b.num||'?'),t:esc(pname(b.patient_id)),s:fdate(b.created_at)+' · '+(b.items||[]).length+' itens',r:`${money(bTot(b).total)}<span class="tag ${s[1]}">${s[0]}</span>`,click:`openBudget('${b.id}','${V.screen==='patient'?'patient':'list'}')`});
}
function scrBudgets(){
  const fl=[['todos','Todos'],['pendente','Pendentes'],['aprovado','Aprovados'],['recusado','Recusados']];
  const l=S.budgets.filter(b=>V.bfilter==='todos'||b.status===V.bfilter).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return head('Orçamentos','nav(\'more\')',`<button class="btn sm" onclick="newBudget()">${ic('plus',16)} Novo</button>`)+
  `<div class="chips">${fl.map(([k,t])=>`<button class="chip ${V.bfilter===k?'on':''}" onclick="V.bfilter='${k}';render()">${t}</button>`).join('')}</div>`+
  (l.length?l.map(budgetRow).join(''):empty('Nenhum orçamento por aqui. Crie um a partir do plano de tratamento de um paciente ou toque em “Novo”.'));
}
function tabOrc(p){
  const l=S.budgets.filter(b=>b.patient_id===p.id).sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return `<button class="btn block mb" onclick="newBudget('${p.id}',null,'patient')">${ic('plus',16)} Novo orçamento</button>`+(l.length?l.map(budgetRow).join(''):empty('Nenhum orçamento para este paciente.'));
}
function newBudget(pid,items,from){

function openBudget(id,from){const b=S.budgets.find(x=>x.id===id);V.bud=JSON.parse(JSON.stringify(b));V.bfrom=from||'list';if(from==='patient')V.pid=b.patient_id;nav('budget');}

  <div class="grid2"><div><label class="f">Nº de parcelas</label><input type="number" min="1" max="60" inputmode="numeric" value="${b.installments||1}" oninput="setB('installments',parseInt(this.value)||1)"></div>

function budgetItems(){

  return it.map((i,k)=>`<div class="bi"><div class="row"><input placeholder="Procedimento" value="${esc(i.description)}" oninput="setBItem(${k},'description',this.value)"><button class="icon" onclick="rmBItem(${k})" aria-label="Remover item">${ic('trash',18)}</button></div>

async function saveBudget(){
  const b=V.bud;
  if(!b.patient_id)return toast('Selecione o paciente.',true);
  const items=b.items.filter(i=>i.description&&i.description.trim());
  if(!items.length)return toast('Adicione pelo menos um procedimento.',true);
  const {isNew,...row}=b;row.items=items;
  const gen=row.status==='aprovado'&&!row.generated&&bTot(row).total>0&&confirm('Lançar a entrada e as parcelas no financeiro como valores a receber?');
  if(gen)row.generated=true;
  await save('budgets',row);
  if(gen){await genInstallments(row);}
  toast(gen?'Orçamento salvo e parcelas lançadas.':'Orçamento salvo.');
  V.bud={...row};backBudget();
}
async function genInstallments(b){
  const t=bTot(b),n=t.n,due=b.first_due||today(),desc='Orçamento #'+b.num,rows=[];
  if(t.entrada>0)rows.push({description:desc+' – entrada',value:+t.entrada.toFixed(2),date:due});
  const rest=+(t.total-t.entrada).toFixed(2),base=Math.floor(rest/n*100)/100;
  for(let i=0;i<n;i++){
    const v=i===n-1?+(rest-base*(n-1)).toFixed(2):base;
    if(v>0)rows.push({description:`${desc} – parcela ${i+1}/${n}`,value:v,date:addMonths(due,i+(t.entrada>0?1:0))});
  }
  await bulkInsert('tx',rows.map(r=>({id:uid(),type:'entrada',category:'Procedimento',status:'pendente',method:null,patient_id:b.patient_id,budget_id:b.id,...r})));
}

function scrFin(){
  const m=V.month,all=S.tx.filter(x=>(x.date||'').slice(0,7)===m);

  l=[...l].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const fl=[['todas','Todos'],['entrada','Entradas'],['despesa','Despesas'],['pendente','Pendentes']];
  const saldo=pg('entrada')-pg('despesa');
  return head('Financeiro',null,`<button class="btn sm" onclick="txForm('','entrada')">${ic('plus',16)} Entrada</button><button class="btn sm ghost" onclick="txForm('','despesa')">${ic('plus',16)} Despesa</button>`)+
  `<div class="daynav"><button class="icon" onclick="V.month=shiftMonth(V.month,-1);render()" aria-label="Mês anterior">${ic('back',20)}</button><div class="sp c"><b style="font-size:17px">${mlabel(m)}</b></div><button class="icon" style="transform:scaleX(-1)" onclick="V.month=shiftMonth(V.month,1);render()" aria-label="Próximo mês">${ic('back',20)}</button></div>
  <div class="card stat"><span>Saldo do mês (pago)</span><b class="${saldo>=0?'pos':'neg'}" style="font-size:28px">${money(saldo)}</b></div>
  <div class="grid2 mt"><div class="card stat"><span>Entradas recebidas</span><b class="pos">${money(pg('entrada'))}</b><small>A receber: ${money(pd('entrada'))}</small></div>
  <div class="card stat"><span>Despesas pagas</span><b class="neg">${money(pg('despesa'))}</b><small>A pagar: ${money(pd('despesa'))}</small></div></div>
  <div class="chips mt">${fl.map(([k,t])=>`<button class="chip ${V.ftype===k?'on':''}" onclick="V.ftype='${k}';render()">${t}</button>`).join('')}</div>

  V.txType=x.type;
  modal(`<h2>${id?'Editar lançamento':'Novo lançamento'}</h2>
  <div class="seg"><button id="tt_entrada" class="${x.type==='entrada'?'on':''}" onclick="setTxType('entrada')">Entrada</button><button id="tt_despesa" class="${x.type==='despesa'?'on':''}" onclick="setTxType('despesa')">Despesa</button></div>
  <label class="f">Descrição</label><input id="f_description" value="${esc(x.description)}" autocomplete="off">
  <div class="grid2"><div><label class="f">Valor (R$)</label><input id="f_value" type="number" step="0.01" inputmode="decimal" value="${x.value==null?'':x.value}"></div><div><label class="f">Data</label><input id="f_date" type="date" value="${esc(x.date)}"></div></div>
  <div class="grid2"><div><label class="f">Categoria</label><select id="f_category">${catOpts(x.type,x.category)}</select></div><div><label class="f">Situação</label><select id="f_status">${opts([['pago','Pago'],['pendente','Pendente']],x.status)}</select></div></div>
  <div class="grid2"><div><label class="f">Forma de pagamento</label><select id="f_method">${opts(['',...METHODS],x.method||'')}</select></div><div><label class="f">Paciente</label><select id="f_patient_id">${patOpts(x.patient_id)}</select></div></div>
  <div class="actions">${id?`<button class="btn danger" onclick="delItem('tx','${id}')">Excluir</button>`:`<button class="btn line" onclick="closeModal()">Cancelar</button>`}<button class="btn" onclick="saveTx('${id||''}')">Salvar</button></div>
  ${id&&x.status==='pendente'?`<button class="btn ghost block mt" onclick="markPaid('${id}')">Marcar como ${x.type==='entrada'?'recebido':'pago'}</button>`:''}`);
}
function setTxType(t){V.txType=t;$('#tt_entrada').classList.toggle('on',t==='entrada');$('#tt_despesa').classList.toggle('on',t==='despesa');$('#f_category').innerHTML=catOpts(t,'');}
async function saveTx(id){
  const description=val('description').trim(),value=num('value');
  if(!description)return toast('Informe a descrição.',true);
  if(value<=0)return toast('Informe um valor maior que zero.',true);
  const old=S.tx.find(x=>x.id===id)||{};
  await save('tx',{...old,id:id||undefined,type:V.txType,description,value,date:val('date')||today(),category:val('category'),status:val('status'),method:val('method'),patient_id:val('patient_id')});
  closeModal();render();toast('Lançamento salvo.');
}
async function markPaid(id){const x=S.tx.find(y=>y.id===id);await save('tx',{...x,status:'pago'});closeModal();render();toast('Baixa registrada.');}
function tabFin(p){
  const l=S.tx.filter(x=>x.patient_id===p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const pago=sum(l.filter(x=>x.type==='entrada'&&x.status==='pago')),pend=sum(l.filter(x=>x.type==='entrada'&&x.status==='pendente'));
  return `<div class="grid2"><div class="card stat"><span>Pago</span><b class="pos">${money(pago)}</b></div><div class="card stat"><span>Em aberto</span><b class="${pend?'neg':''}">${money(pend)}</b></div></div>
  <button class="btn block mt mb" onclick="txForm('','entrada','${p.id}')">${ic('plus',16)} Lançar recebimento</button>
  ${l.length?l.map(txRow).join(''):empty('Nenhum lançamento para este paciente.')}`;
}

/* ---------- relatórios ---------- */
function group(list,key){const m={};list.forEach(x=>{const k=x[key]||'Sem categoria';m[k]=(m[k]||0)+Number(x.value||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function hbars(arr){
  if(!arr.length)return '<p class="muted" style="margin:6px 0 0">Sem dados no período.</p>';
  const mx=arr[0][1]||1;
  return arr.slice(0,7).map(([k,v])=>`<div class="hb"><span title="${esc(k)}">${esc(k)}</span><div class="bar"><i style="width:${Math.max(3,v/mx*100)}%"></i></div><b>${money(v)}</b></div>`).join('');
}
function periodRange(){const end=today().slice(0,7),start=shiftMonth(end,-(V.period-1));return {end,start,months:Array.from({length:V.period},(_,i)=>shiftMonth(start,i))};}
function scrReports(){
  const {end,start,months}=periodRange();
  const inR=d=>{const m=(d||'').slice(0,7);return m>=start&&m<=end;};
  const tx=S.tx.filter(x=>inR(x.date)),pagos=tx.filter(x=>x.status==='pago');
  const ent=sum(pagos.filter(x=>x.type==='entrada')),desp=sum(pagos.filter(x=>x.type==='despesa')),res=ent-desp;
  const byM=months.map(m=>({m,e:sum(pagos.filter(x=>x.type==='entrada'&&x.date.slice(0,7)===m)),d:sum(pagos.filter(x=>x.type==='despesa'&&x.date.slice(0,7)===m))}));
  const mx=Math.max(1,...byM.flatMap(x=>[x.e,x.d]));
  const bs=S.budgets.filter(b=>inR(b.created_at)),apr=bs.filter(b=>b.status==='aprovado');
  const done=S.plans.filter(x=>x.status==='concluido'),byProc={};
  done.forEach(x=>{const k=x.proc||'—';byProc[k]=byProc[k]||{n:0,v:0};byProc[k].n++;byProc[k].v+=Number(x.value||0);});
  const topProc=Object.entries(byProc).sort((a,b)=>b[1].v-a[1].v).slice(0,6);
  const atras=S.tx.filter(x=>x.type==='entrada'&&x.status==='pendente'&&x.date&&x.date<today());
  const novos=S.patients.filter(p=>inR(p.created_at)).length;
  const per=[[1,'Este mês'],[3,'3 meses'],[6,'6 meses'],[12,'12 meses']];
  return head('Relatórios',"nav('more')",`<button class="btn sm ghost" onclick="exportCsv()">${ic('save',16)} CSV</button>`)+
  `<div class="chips">${per.map(([n,t])=>`<button class="chip ${V.period===n?'on':''}" onclick="V.period=${n};render()">${t}</button>`).join('')}</div>
  <div class="grid2"><div class="card stat"><span>Entradas recebidas</span><b class="pos">${money(ent)}</b></div><div class="card stat"><span>Despesas pagas</span><b class="neg">${money(desp)}</b></div>
  <div class="card stat"><span>Resultado</span><b class="${res>=0?'pos':'neg'}">${money(res)}</b></div><div class="card stat"><span>Margem</span><b>${ent?Math.round(res/ent*100):0}%</b></div></div>
  <div class="card mt"><h3>Fluxo de caixa por mês</h3><div class="bars mt">${byM.map(x=>`<div class="bcol"><div class="bpair"><i style="height:${x.e/mx*100}px;background:var(--brand)" title="Entradas ${money(x.e)}"></i><i style="height:${x.d/mx*100}px;background:var(--rose)" title="Despesas ${money(x.d)}"></i></div><small>${MONTHS[+x.m.slice(5,7)-1].slice(0,3)}</small></div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--brand)"></i>Entradas</span><span><i style="background:var(--rose)"></i>Despesas</span></div></div>
  <div class="card mt"><h3>Despesas por categoria</h3>${hbars(group(pagos.filter(x=>x.type==='despesa'),'category'))}</div>
  <div class="card mt"><h3>Entradas por categoria</h3>${hbars(group(pagos.filter(x=>x.type==='entrada'),'category'))}</div>
  <div class="card mt"><h3>Entradas por forma de pagamento</h3>${hbars(group(pagos.filter(x=>x.type==='entrada'),'method'))}</div>
  <div class="card mt"><h3>Orçamentos do período</h3>
   <div class="kv"><span>Criados</span><b>${bs.length}</b></div><div class="kv"><span>Aprovados</span><b>${apr.length}${bs.length?' ('+Math.round(apr.length/bs.length*100)+'%)':''}</b></div>
   <div class="kv"><span>Valor aprovado</span><b>${money(apr.reduce((s,b)=>s+bTot(b).total,0))}</b></div>
   <div class="kv"><span>Aguardando resposta</span><b>${money(bs.filter(b=>b.status==='pendente').reduce((s,b)=>s+bTot(b).total,0))}</b></div></div>
  <div class="card mt"><h3>Procedimentos concluídos (todo o histórico)</h3>${topProc.length?topProc.map(([k,v])=>`<div class="kv"><span>${esc(k)} · ${v.n}×</span><b>${money(v.v)}</b></div>`).join(''):'<p class="muted" style="margin:6px 0 0">Marque procedimentos do plano como concluídos para vê-los aqui.</p>'}</div>
  <div class="card mt"><h3>Pacientes e inadimplência</h3>
   <div class="kv"><span>Pacientes cadastrados</span><b>${S.patients.length}</b></div><div class="kv"><span>Novos no período</span><b>${novos}</b></div>
   <div class="kv"><span>Recebimentos em atraso</span><b class="${atras.length?'neg':''}">${money(sum(atras))} (${atras.length})</b></div></div>`;
}
function exportCsv(){
  const {start,end}=periodRange(),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=S.tx.filter(x=>{const m=(x.date||'').slice(0,7);return m>=start&&m<=end;}).sort((a,b)=>a.date.localeCompare(b.date));
  const csv='\uFEFF'+['Data','Tipo','Descrição','Categoria','Forma','Paciente','Situação','Valor'].map(q).join(';')+'\n'+
   rows.map(x=>[fdate(x.date),x.type,x.description,x.category,x.method,x.patient_id?pname(x.patient_id):'',x.status,String(x.value).replace('.',',')].map(q).join(';')).join('\n');
  download(`financeiro-${start}-a-${end}.csv`,csv,'text/csv;charset=utf-8');
}

/* ---------- mais ---------- */
function scrMore(){
  const m=(icon,t,s,click)=>`<button class="menu" onclick="${click}"><span class="mi">${ic(icon,22)}</span><span class="sp"><b>${t}</b><small>${s}</small></span>${ic('chev',18)}</button>`;
  const pend=S.budgets.filter(b=>b.status==='pendente').length;
  return head('Mais')+
  m('file','Orçamentos',pend?pend+' aguardando resposta':'Todos os orçamentos',"nav('budgets')")+
  m('chart','Relatórios','Fluxo de caixa, categorias, orçamentos',"nav('reports')")+
  m('tooth','Tabela de procedimentos',S.procs.length+' procedimentos com valores',"nav('procs')")+
  m('gear','Dados da clínica',esc(CLINIC.name||'Nome, responsável, CRO e telefone'),'clinicForm()')+
  (LOCAL?m('plus','Carregar dados de exemplo','Pacientes e lançamentos fictícios para testar','seedDemo()')+m('save','Exportar backup','Baixa um arquivo .json com todos os dados','download(\'gestor-odonto-backup.json\',JSON.stringify(S),\'application/json\')')+m('send','Restaurar backup','Importa um arquivo .json exportado antes','$(\'#bk\').click()')+'<input id="bk" type="file" accept=".json,application/json" hidden onchange="importBackup(this)">'+m('trash','Apagar dados deste aparelho','Remove tudo do modo local','wipeLocal()')
       :m('out','Sair da conta',esc(user&&user.email||''),'doLogout()'));
}
function clinicForm(){
  modal(`<h2>Dados da clínica</h2><p class="muted">Aparecem no orçamento impresso e nas mensagens de WhatsApp.</p>
  <label class="f">Nome da clínica</label><input id="f_cname" value="${esc(CLINIC.name)}">
  <label class="f">Responsável técnico</label><input id="f_cdentist" value="${esc(CLINIC.dentist)}">
  <div class="grid2"><div><label class="f">CRO</label><input id="f_ccro" value="${esc(CLINIC.cro)}"></div><div><label class="f">Telefone</label><input id="f_cphone" inputmode="tel" value="${esc(CLINIC.phone)}"></div></div>
  <div class="actions"><button class="btn line" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveClinic()">Salvar</button></div>`);
}
async function saveClinic(){
  CLINIC={name:val('cname').trim(),dentist:val('cdentist').trim(),cro:val('ccro').trim(),phone:val('cphone').trim()};
  try{localStorage.setItem(LSC,JSON.stringify(CLINIC));}catch(e){}
  if(!LOCAL){const {error}=await sb.auth.updateUser({data:{clinic:CLINIC}});if(error)toast('Erro ao salvar: '+error.message,true);}
  closeModal();render();toast('Dados da clínica salvos.');
}
function scrProcs(){
  const l=[...S.procs].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  return head('Procedimentos',"nav('more')",`<button class="btn sm" onclick="procForm()">${ic('plus',16)} Novo</button>`)+
  `<p class="hint" style="margin-top:0">Os valores iniciais são apenas exemplos. Ajuste para a sua tabela de preços.</p>`+
  (l.length?l.map(o=>item({av:ic('tooth',18),t:esc(o.name),s:'',r:money(o.value),click:`procForm('${o.id}')`})).join(''):empty('Nenhum procedimento cadastrado.'));
}
function procForm(id){
  const o=S.procs.find(x=>x.id===id)||{};
  modal(`<h2>${id?'Editar procedimento':'Novo procedimento'}</h2>
  <label class="f">Nome</label><input id="f_name" value="${esc(o.name)}"><label class="f">Valor (R$)</label><input id="f_value" type="number" step="0.01" inputmode="decimal" value="${o.value==null?'':o.value}">
  <div class="actions">${id?`<button class="btn danger" onclick="delItem('procs','${id}')">Excluir</button>`:`<button class="btn line" onclick="closeModal()">Cancelar</button>`}<button class="btn" onclick="saveProc('${id||''}')">Salvar</button></div>`);
}
async function saveProc(id){
  const name=val('name').trim();if(!name)return toast('Informe o nome.',true);
  const old=S.procs.find(x=>x.id===id)||{};
  await save('procs',{...old,id:id||undefined,name,value:num('value')});closeModal();render();toast('Procedimento salvo.');
}
function importBackup(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Substituir os dados atuais pelo backup?'))return;S={patients:[],plans:[],budgets:[],tx:[],appts:[],procs:[],...d};persistLocal();render();toast('Backup restaurado.');}catch(e){toast('Arquivo inválido.',true);}};
  r.readAsText(f);
}
function wipeLocal(){if(!confirm('Apagar todos os dados salvos neste aparelho? Isso não pode ser desfeito.'))return;S={patients:[],plans:[],budgets:[],tx:[],appts:[],procs:[]};persistLocal();seedProcsIfEmpty().then(()=>{render();toast('Dados apagados.');});}
async function seedDemo(){
  if(!confirm('Adicionar pacientes e lançamentos de exemplo?'))return;
  const mm=today().slice(5,7);
  const P=[['Ana Beatriz Souza','(62) 99111-2233','1991-'+mm+'-14'],['Carlos Eduardo Lima','(62) 99222-3344','1984-03-02'],['Marina Alves','(62) 99333-4455','2001-11-27']].map(([name,phone,birth])=>({id:uid(),name,phone,birth,email:null,cpf:null,notes:null,odonto:{}}));
  P[0].odonto={16:{faces:{O:'carie',M:'carie'}},26:{whole:'canal',faces:{}},36:{whole:'coroa',faces:{}},18:{whole:'ext_ind',faces:{}},46:{faces:{O:'restauracao'}},11:{faces:{V:'fratura'}},48:{whole:'ausente',faces:{}}};
  await bulkInsert('patients',P);
  const pl=(i,tooth,proc,value,status)=>({id:uid(),patient_id:P[i].id,tooth,proc,value,status});
  await bulkInsert('plans',[pl(0,'16','Restauração de resina - 2 faces',280,'planejado'),pl(0,'26','Tratamento de canal (endodontia)',900,'concluido'),pl(0,'36','Coroa protética',1500,'andamento'),pl(0,'18','Extração de siso',500,'planejado'),pl(1,'','Profilaxia (limpeza)',180,'concluido')]);
  await bulkInsert('budgets',[{id:uid(),patient_id:P[1].id,num:1,items:[{description:'Restauração de resina - 2 faces',tooth:'16',qty:1,value:280},{description:'Tratamento de canal (endodontia)',tooth:'26',qty:1,value:900}],discount:5,entrada:200,installments:3,first_due:today(),status:'pendente',generated:false,notes:null}]);
  const base=today().slice(0,7)+'-10',tx=[];
  for(let i=0;i<4;i++){
    const d=addMonths(base,-i);
    tx.push({type:'entrada',description:'Atendimentos do mês',category:'Procedimento',value:4200+i*350,date:d,status:'pago',method:'Pix'},
      {type:'entrada',description:'Ortodontia – manutenções',category:'Ortodontia',value:1800,date:d,status:'pago',method:'Cartão de crédito'},
      {type:'despesa',description:'Aluguel da sala',category:'Aluguel',value:1800,date:d,status:'pago',method:'Boleto'},
      {type:'despesa',description:'Material odontológico',category:'Material',value:900+i*60,date:d,status:'pago',method:'Pix'},
      {type:'despesa',description:'Laboratório de prótese',category:'Laboratório',value:650,date:d,status:'pago',method:'Pix'},
      {type:'despesa',description:'Auxiliar / recepção',category:'Salários',value:1500,date:d,status:'pago',method:'Transferência'});
  }
  tx.push({type:'entrada',description:'Coroa – parcela 2/3',category:'Procedimento',value:500,date:addMonths(today(),-1),status:'pendente',method:null,patient_id:P[0].id},{type:'entrada',description:'Coroa – parcela 3/3',category:'Procedimento',value:500,date:addMonths(today(),1),status:'pendente',method:null,patient_id:P[0].id});
  await bulkInsert('tx',tx.map(x=>({id:uid(),patient_id:null,budget_id:null,...x})));
  const tm=new Date();tm.setDate(tm.getDate()+1);
  await bulkInsert('appts',[{id:uid(),patient_id:P[0].id,date:today(),time:'09:00',proc:'Restauração de resina - 2 faces',status:'confirmado'},{id:uid(),patient_id:P[2].id,date:today(),time:'14:30',proc:'Consulta / avaliação',status:'agendado'},{id:uid(),patient_id:P[1].id,date:iso(tm),time:'10:00',proc:'Profilaxia (limpeza)',status:'agendado'}]);
  render();toast('Dados de exemplo adicionados.');
}

/* ---------- início do app ---------- */
(async function boot(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase){
    LOCAL=false;sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data}=await sb.auth.getSession();
    if(data.session){user=data.session.user;await afterLogin();}else renderAuth();
  }else{LOCAL=true;loadLocal();loadClinic();await seedProcsIfEmpty();render();}
})();
</script>
</body>
</html>
